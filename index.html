<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>夏以昼 · 引力所归</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --gold: #d4933a;
    --gold-light: #e8c87a;
    --purple: #7b5ea7;
    --purple-deep: #4a3670;
    --bg-dark: #070a12;
    --bg-panel: rgba(12, 16, 28, 0.95);
    --text-main: #e0d5c0;
    --text-dim: #8a7a5a;
    --text-ghost: #4a3a2a;
    --border-gold: rgba(212, 147, 58, 0.3);
    --border-soft: rgba(180, 140, 80, 0.12);
  }

  body {
    background: var(--bg-dark);
    font-family: 'Noto Serif SC', "PingFang SC", "Microsoft YaHei", serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
    overflow: hidden;
  }

  /* 深空星域背景 */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 15% 20%, rgba(123, 94, 167, 0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 85% 80%, rgba(212, 147, 58, 0.05) 0%, transparent 50%),
      radial-gradient(1.5px 1.5px at 12% 25%, rgba(255,220,150,0.7), transparent),
      radial-gradient(1px 1px at 35% 65%, rgba(255,255,255,0.4), transparent),
      radial-gradient(2px 2px at 58% 15%, rgba(255,200,100,0.5), transparent),
      radial-gradient(1px 1px at 78% 45%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1.5px 1.5px at 8% 78%, rgba(200,160,255,0.4), transparent),
      radial-gradient(1px 1px at 68% 88%, rgba(255,255,255,0.35), transparent),
      radial-gradient(1px 1px at 45% 38%, rgba(255,180,80,0.3), transparent),
      radial-gradient(2px 2px at 92% 12%, rgba(255,200,100,0.45), transparent),
      radial-gradient(1px 1px at 25% 90%, rgba(255,255,255,0.25), transparent),
      radial-gradient(1.5px 1.5px at 72% 72%, rgba(180,140,255,0.3), transparent);
    pointer-events: none;
    z-index: 0;
  }

  /* 星云光晕 */
  .nebula {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background:
      radial-gradient(circle at 20% 30%, rgba(123, 94, 167, 0.06) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(212, 147, 58, 0.04) 0%, transparent 40%);
    animation: nebulaShift 20s ease-in-out infinite alternate;
  }

  @keyframes nebulaShift {
    0% { opacity: 0.6; transform: scale(1); }
    100% { opacity: 1; transform: scale(1.05); }
  }

  .terminal {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 720px;
    height: 92vh;
    max-height: 860px;
    background: var(--bg-panel);
    border: 1px solid var(--border-gold);
    border-radius: 16px;
    box-shadow:
      0 0 60px rgba(200, 150, 70, 0.06),
      0 0 120px rgba(100, 80, 180, 0.04),
      0 20px 60px rgba(0,0,0,0.6),
      inset 0 0 80px rgba(0,0,0,0.4);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* 顶部装饰线 */
  .terminal::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), var(--purple), var(--gold), transparent);
    opacity: 0.6;
  }

  /* ===== 头部 ===== */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px 12px;
    background: linear-gradient(135deg, rgba(30,25,50,0.95), rgba(18,15,32,0.95));
    border-bottom: 1px solid var(--border-soft);
    flex-shrink: 0;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .avatar-ring {
    position: relative;
    width: 46px;
    height: 46px;
  }

  .avatar-ring::before {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    background: conic-gradient(var(--gold), var(--purple), var(--gold), var(--purple), var(--gold));
    animation: ringRotate 8s linear infinite;
  }

  @keyframes ringRotate {
    to { transform: rotate(360deg); }
  }

  .avatar {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: linear-gradient(135deg, #5a3d8a, #b8862d);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 700;
    color: #fff;
    z-index: 1;
  }

  .header-info h1 {
    font-size: 16px;
    color: var(--gold-light);
    font-weight: 600;
    letter-spacing: 2px;
  }

  .header-info .status {
    font-size: 11px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 3px;
    letter-spacing: 0.5px;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #5ad87a;
    box-shadow: 0 0 8px #5ad87a;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* 模式切换 */
  .mode-switch {
    display: flex;
    background: rgba(255,255,255,0.04);
    border-radius: 22px;
    padding: 3px;
    gap: 2px;
    border: 1px solid rgba(180,140,80,0.12);
  }

  .mode-btn {
    padding: 6px 16px;
    border: none;
    border-radius: 19px;
    font-size: 11.5px;
    cursor: pointer;
    transition: all 0.35s;
    background: transparent;
    color: var(--text-ghost);
    letter-spacing: 1px;
    font-family: inherit;
  }

  .mode-btn.active {
    background: linear-gradient(135deg, var(--purple), #b8862d);
    color: #fff;
    box-shadow: 0 2px 12px rgba(180, 140, 80, 0.3);
  }

  /* ===== 多维状态面板 ===== */
  .status-panel {
    padding: 10px 24px 8px;
    border-bottom: 1px solid var(--border-soft);
    flex-shrink: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 20px;
  }

  .stat-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .stat-label {
    font-size: 10px;
    color: var(--text-ghost);
    letter-spacing: 1.5px;
    white-space: nowrap;
    min-width: 42px;
  }

  .stat-track {
    flex: 1;
    height: 3px;
    background: rgba(255,255,255,0.05);
    border-radius: 2px;
    overflow: hidden;
  }

  .stat-fill {
    height: 100%;
    width: 0%;
    border-radius: 2px;
    transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .stat-fill.affection {
    background: linear-gradient(90deg, var(--purple), var(--gold), #ff6b8a);
  }

  .stat-fill.trust {
    background: linear-gradient(90deg, #3a6a9a, #5aadcf);
  }

  .stat-fill.tension {
    background: linear-gradient(90deg, #8a3a5a, #cf5a7a);
  }

  .stat-fill.gravity {
    background: linear-gradient(90deg, #4a3670, #7b5ea7, #b8862d);
  }

  .stat-value {
    font-size: 10px;
    color: var(--gold);
    min-width: 24px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  /* ===== 聊天区域 ===== */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 18px 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
    min-height: 0;
  }

  .chat-area::-webkit-scrollbar { width: 3px; }
  .chat-area::-webkit-scrollbar-track { background: transparent; }
  .chat-area::-webkit-scrollbar-thumb {
    background: rgba(180,140,80,0.2);
    border-radius: 2px;
  }

  /* 消息 */
  .msg {
    display: flex;
    gap: 10px;
    max-width: 86%;
    animation: fadeIn 0.4s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.xia { align-self: flex-start; }
  .msg.me { align-self: flex-end; flex-direction: row-reverse; }

  .msg .mini-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: #fff;
  }

  .msg.xia .mini-avatar {
    background: linear-gradient(135deg, #5a3d8a, #b8862d);
    box-shadow: 0 0 12px rgba(180, 140, 80, 0.15);
  }

  .msg.me .mini-avatar {
    background: linear-gradient(135deg, #2a4a6a, #4a8aaa);
  }

  .bubble {
    padding: 11px 16px;
    border-radius: 14px;
    font-size: 13.5px;
    line-height: 1.75;
    word-break: break-word;
  }

  .msg.xia .bubble {
    background: linear-gradient(135deg, rgba(45,35,70,0.9), rgba(30,25,50,0.9));
    border: 1px solid rgba(180,140,80,0.18);
    color: var(--text-main);
    border-top-left-radius: 4px;
  }

  .msg.me .bubble {
    background: linear-gradient(135deg, rgba(25,45,75,0.9), rgba(20,35,60,0.9));
    border: 1px solid rgba(90,140,200,0.18);
    color: #c0d5e8;
    border-top-right-radius: 4px;
  }

  /* 系统消息 */
  .system-msg {
    text-align: center;
    font-size: 11px;
    color: var(--text-ghost);
    letter-spacing: 2px;
    padding: 4px 0;
    position: relative;
  }

  .system-msg::before,
  .system-msg::after {
    content: '· · ·';
    margin: 0 10px;
    color: rgba(180,140,80,0.15);
  }

  /* 记忆回溯卡片 */
  .memory-card {
    align-self: center;
    max-width: 90%;
    padding: 14px 18px;
    background: linear-gradient(135deg, rgba(123, 94, 167, 0.08), rgba(212, 147, 58, 0.06));
    border: 1px solid rgba(212, 147, 58, 0.15);
    border-radius: 10px;
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.8;
    animation: memoryFade 1s ease;
    position: relative;
    overflow: hidden;
  }

  .memory-card::before {
    content: '◈ 记忆回溯';
    display: block;
    font-size: 10px;
    color: var(--gold);
    letter-spacing: 2px;
    margin-bottom: 8px;
    opacity: 0.7;
  }

  @keyframes memoryFade {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
  }

  /* 打字指示器 */
  .typing-indicator {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 10px 16px;
  }

  .typing-indicator span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-dim);
    animation: typing 1.2s infinite;
  }

  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes typing {
    0%, 60%, 100% { opacity: 0.25; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-5px); }
  }

  /* ===== 快捷操作 ===== */
  .quick-options {
    padding: 0 24px 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    flex-shrink: 0;
  }

  .quick-btn {
    padding: 6px 14px;
    border-radius: 16px;
    border: 1px solid rgba(180,140,80,0.2);
    background: rgba(255,255,255,0.02);
    color: #8a7a5a;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.3s;
    font-family: inherit;
    letter-spacing: 0.5px;
  }

  .quick-btn:hover {
    background: rgba(180,140,80,0.1);
    color: var(--gold-light);
    border-color: rgba(180,140,80,0.45);
    box-shadow: 0 0 16px rgba(180,140,80,0.08);
  }

  .quick-btn.special {
    border-color: rgba(123, 94, 167, 0.3);
    color: #9a7abf;
  }

  .quick-btn.special:hover {
    background: rgba(123, 94, 167, 0.1);
    border-color: rgba(123, 94, 167, 0.6);
    color: #c8a8e8;
  }

  /* ===== 输入区 ===== */
  .input-area {
    padding: 12px 24px 18px;
    border-top: 1px solid var(--border-soft);
    display: flex;
    gap: 10px;
    align-items: center;
    background: rgba(8,11,20,0.7);
    flex-shrink: 0;
  }

  .input-area input {
    flex: 1;
    padding: 11px 18px;
    border-radius: 24px;
    border: 1px solid rgba(180,140,80,0.18);
    background: rgba(255,255,255,0.03);
    color: var(--text-main);
    font-size: 13px;
    outline: none;
    transition: all 0.35s;
    font-family: inherit;
  }

  .input-area input::placeholder {
    color: var(--text-ghost);
    font-style: italic;
  }

  .input-area input:focus {
    border-color: rgba(200,160,80,0.45);
    box-shadow: 0 0 20px rgba(180,140,80,0.08);
    background: rgba(255,255,255,0.05);
  }

  .input-area button {
    padding: 11px 24px;
    border-radius: 24px;
    border: none;
    background: linear-gradient(135deg, var(--purple), #b8862d);
    color: #fff;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.35s;
    white-space: nowrap;
    letter-spacing: 2px;
    font-family: inherit;
  }

  .input-area button:hover {
    box-shadow: 0 0 28px rgba(180,140,80,0.25);
    transform: translateY(-1px);
  }

  .input-area button:active {
    transform: translateY(0);
  }

  /* ===== 特殊事件弹窗 ===== */
  .event-overlay {
    position: absolute;
    inset: 0;
    background: rgba(5, 7, 12, 0.88);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s;
    border-radius: 16px;
  }

  .event-overlay.active {
    opacity: 1;
    pointer-events: all;
  }

  .event-box {
    max-width: 460px;
    width: 90%;
    padding: 28px 32px;
    background: linear-gradient(135deg, rgba(30,25,50,0.98), rgba(18,15,32,0.98));
    border: 1px solid rgba(212, 147, 58, 0.3);
    border-radius: 12px;
    text-align: center;
    transform: scale(0.9);
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 0 60px rgba(180,140,80,0.1);
  }

  .event-overlay.active .event-box {
    transform: scale(1);
  }

  .event-box .event-icon {
    font-size: 32px;
    margin-bottom: 12px;
    display: block;
  }

  .event-box h3 {
    font-size: 15px;
    color: var(--gold-light);
    letter-spacing: 3px;
    margin-bottom: 12px;
  }

  .event-box p {
    font-size: 12.5px;
    color: var(--text-dim);
    line-height: 1.8;
    margin-bottom: 20px;
  }

  .event-box button {
    padding: 9px 28px;
    border-radius: 20px;
    border: 1px solid rgba(212, 147, 58, 0.4);
    background: transparent;
    color: var(--gold-light);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.3s;
    letter-spacing: 2px;
    font-family: inherit;
  }

  .event-box button:hover {
    background: rgba(212, 147, 58, 0.12);
    box-shadow: 0 0 20px rgba(212, 147, 58, 0.15);
  }

  /* 响应式 */
  @media (max-width: 520px) {
    .terminal { border-radius: 10px; height: 96vh; }
    .chat-area { padding: 14px 16px; }
    .header { padding: 12px 16px 10px; }
    .status-panel { padding: 8px 16px 6px; grid-template-columns: 1fr; }
    .quick-options { padding: 0 16px 8px; }
    .input-area { padding: 10px 16px 14px; }
    .bubble { font-size: 12.5px; padding: 9px 13px; }
    .mode-btn { padding: 5px 12px; font-size: 10.5px; }
  }
</style>
</head>
<body>

<div class="nebula"></div>

<div class="terminal">
  <!-- 头部 -->
  <div class="header">
    <div class="header-left">
      <div class="avatar-ring">
        <div class="avatar">昼</div>
      </div>
      <div class="header-info">
        <h1>夏以昼</h1>
        <div class="status">
          <span class="status-dot"></span>
          <span id="statusText">远空舰队 · 引力场稳定</span>
        </div>
      </div>
    </div>
    <div class="mode-switch">
      <button class="mode-btn active" data-mode="brother" onclick="switchMode('brother')">☀ 日常</button>
      <button class="mode-btn" data-mode="officer" onclick="switchMode('officer')">◈ 执舰官</button>
    </div>
  </div>

  <!-- 多维状态 -->
  <div class="status-panel">
    <div class="stat-row">
      <span class="stat-label">牵绊</span>
      <div class="stat-track"><div class="stat-fill affection" id="affectionFill"></div></div>
      <span class="stat-value" id="affectionValue">0</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">信任</span>
      <div class="stat-track"><div class="stat-fill trust" id="trustFill"></div></div>
      <span class="stat-value" id="trustValue">0</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">张力</span>
      <div class="stat-track"><div class="stat-fill tension" id="tensionFill"></div></div>
      <span class="stat-value" id="tensionValue">0</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">引力</span>
      <div class="stat-track"><div class="stat-fill gravity" id="gravityFill"></div></div>
      <span class="stat-value" id="gravityValue">0</span>
    </div>
  </div>

  <!-- 聊天区 -->
  <div class="chat-area" id="chatArea"></div>

  <!-- 快捷操作 -->
  <div class="quick-options" id="quickOptions"></div>

  <!-- 输入区 -->
  <div class="input-area">
    <input type="text" id="userInput" placeholder="对他说话……" autocomplete="off">
    <button onclick="sendMessage()">发送</button>
  </div>

  <!-- 事件弹窗 -->
  <div class="event-overlay" id="eventOverlay">
    <div class="event-box" id="eventBox">
      <span class="event-icon" id="eventIcon"></span>
      <h3 id="eventTitle"></h3>
      <p id="eventDesc"></p>
      <button onclick="closeEvent()">继续</button>
    </div>
  </div>
</div>

<script>
// =============================================
// 夏以昼 · 引力所归 — 深度互动终端
// 设定依据：恋与深空官方资料 + 角色剧情线
// 核心：明暗反差 / 温柔腹黑 / 偏执占有 / 引力控制
// =============================================

// ========== 全局状态 ==========
const state = {
  mode: 'brother',      // brother | officer
  affection: 0,          // 牵绊度 0-100
  trust: 0,              // 信任度 0-100
  tension: 0,            // 张力值 0-100
  gravity: 0,            // 引力共鸣 0-100
  turnCount: 0,          // 对话轮数
  isTyping: false,
  triggeredMemories: new Set(),
  triggeredEvents: new Set(),
  chatLog: [],
  consecutiveIntimacy: 0,  // 连续亲密对话计数
  lastTopic: null
};

// ========== 记忆碎片库 ==========
// 基于官方剧情：盖亚实验室 / 奶奶 / 军校 / 爆炸 / 重逢 / 无尽夏
const memoryFragments = [
  {
    id: 'childhood',
    trigger: { minAffection: 8, keywords: ['小时候', '童年', '从前', '以前'] },
    text: '那年你五岁，奶奶带着七岁的他出现在孤儿院门口。你跑过去拉住他的手，喊了一声"哥哥"。他愣了一下，然后轻轻回握住你。从那以后，他就再也没有松开过。'
  },
  {
    id: 'lab',
    trigger: { minAffection: 15, keywords: ['实验', '盖亚', '002', '研究'] },
    text: '盖亚研究中心，002号供体。九岁的他被进行了742次实验。别的小孩被父母呵护的年纪，他已经在学习如何在疼痛中保持清醒。可他从来不对你说这些。你问起的时候，他只是笑笑："都过去了。"'
  },
  {
    id: 'military',
    trigger: { minAffection: 20, keywords: ['军校', '天行大学', '飞行', '飞行员', '飞机'] },
    text: '他考上天行大学航天学院那年，你在车站送他。海棠花开得正盛。他弯腰替你拂去肩上的花瓣，说："等我回来。"后来他成了DAA战斗机飞行员，代号FY-26。你小时候最喜欢的那架。'
  },
  {

// ========== DOM 引用 ==========
const chatArea = document.getElementById('chatArea');

// ========== 工具函数 ==========
function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

function updateStats(effect) {
  if (!effect) effect = {};
  state.affection = clamp(state.affection + (effect.affection || 0), 0, 100);
  state.trust = clamp(state.trust + (effect.trust || 0), 0, 100);
  state.tension = clamp(state.tension + (effect.tension || 0), 0, 100);
  state.gravity = clamp(state.gravity + Math.round((state.affection * 0.5 + state.tension * 0.3) / 5), 0, 100);

  document.getElementById('affectionFill').style.width = state.affection + '%';
  document.getElementById('affectionValue').textContent = Math.round(state.affection);
  document.getElementById('trustFill').style.width = state.trust + '%';
  document.getElementById('trustValue').textContent = Math.round(state.trust);
  document.getElementById('tensionFill').style.width = state.tension + '%';
  document.getElementById('tensionValue').textContent = Math.round(state.tension);
  document.getElementById('gravityFill').style.width = state.gravity + '%';
  document.getElementById('gravityValue').textContent = Math.round(state.gravity);

  // 状态文字
  updateStatusText();

  // 检查事件
  checkSpecialEvents();
}

function updateStatusText() {
  if (state.mode === 'brother') {
    if (state.tension >= 50) statusText.textContent = '远空舰队 · 引力场异常';
    else if (state.affection >= 60) statusText.textContent = '远空舰队 · 牵绊极深';
    else if (state.affection >= 30) statusText.textContent = '远空舰队 · 信号稳定';
    else statusText.textContent = '远空舰队 · 通讯中';
  } else {
    if (state.tension >= 60) statusText.textContent = '远空舰队 · 加密频道 · 封锁';
    else if (state.gravity >= 60) statusText.textContent = '远空舰队 · 引力锁定';
    else if (state.affection >= 40) statusText.textContent = '远空舰队 · 执舰官频道';
    else statusText.textContent = '远空舰队 · 加密频道';
  }
}

// ========== 消息渲染 ==========
function addXiaMsg(text, delay) {
  if (delay) {
    showTyping();
    setTimeout(() => { hideTyping(); renderXiaMsg(text); }, delay);
  } else {
    renderXiaMsg(text);
  }
}

function renderXiaMsg(text) {
  const div = document.createElement('div');
  div.className = 'msg xia';
  div.innerHTML = `<div class="mini-avatar">昼</div><div class="bubble">${text}</div>`;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
  state.chatLog.push({ role: 'xia', text });
}

function addMeMsg(text) {
  const div = document.createElement('div');
  div.className = 'msg me';
  div.innerHTML = `<div class="mini-avatar">你</div><div class="bubble">${text}</div>`;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
  state.chatLog.push({ role: 'me', text });
}

function addSystemMsg(text) {
  const div = document.createElement('div');
  div.className = 'system-msg';
  div.textContent = text;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function addMemoryCard(text) {
  const div = document.createElement('div');
  div.className = 'memory-card';
  div.textContent = text;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

// ========== 打字指示器 ==========
let typingEl = null;
function showTyping() {
  if (typingEl) return;
  state.isTyping = true;
  typingEl = document.createElement('div');
  typingEl.className = 'msg xia';
  typingEl.innerHTML = `<div class="mini-avatar">昼</div><div class="bubble"><div class="typing-indicator"><span></span><span></span><span></span></div></div>`;
  chatArea.appendChild(typingEl);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function hideTyping() {
  if (typingEl) { typingEl.remove(); typingEl = null; }
  state.isTyping = false;
}

// ========== 特殊事件检查 ==========
function checkSpecialEvents() {
  for (const evt of specialEvents) {
    if (state.triggeredEvents.has(evt.id)) continue;
    if (evt.condition()) {
      state.triggeredEvents.add(evt.id);
      setTimeout(() => showEvent(evt), 1200);
      break;
    }
  }
}

function showEvent(evt) {
  document.getElementById('eventIcon').textContent = evt.icon;
  document.getElementById('eventTitle').textContent = evt.title;
  document.getElementById('eventDesc').textContent = evt.desc;
  eventOverlay.classList.add('active');
}

function closeEvent() {
  eventOverlay.classList.remove('active');
}

// ========== 记忆碎片检测 ==========
function checkMemory(userText) {
  for (const mem of memoryFragments) {
    if (state.triggeredMemories.has(mem.id)) continue;
    if (state.affection < mem.trigger.minAffection) continue;
    if (mem.trigger.keywords.some(k => userText.includes(k))) {
      state.triggeredMemories.add(mem.id);
      setTimeout(() => addMemoryCard(mem.text), 900);
      return;
    }
  }
}

// ========== 回复匹配 ==========
function findReply(userText) {
  const db = replyDB[state.mode];
  for (const entry of db) {
    if (entry.keys.some(k => userText.includes(k))) {
      return { reply: rand(entry.replies), effect: entry.effect };
    }
  }
  return null;
}

// ========== 发送消息 ==========
function sendMessage() {
  const text = userInput.value.trim();
  if (!text || state.isTyping) return;

  userInput.value = '';
  addMeMsg(text);
  state.turnCount++;

  // 检测记忆
  checkMemory(text);

  // 匹配回复
  const matched = findReply(text);
  const delay = 700 + Math.random() * 900;

  if (matched) {
    setTimeout(() => {
      addXiaMsg(matched.reply, 400);
      updateStats(matched.effect);
    }, delay);
  } else {
    // 回退回复
    const fallbacks = getFallbacks();
    setTimeout(() => {
      addXiaMsg(rand(fallbacks), 500);
      updateStats({ affection: 1, trust: 1, tension: 0 });
    }, delay);
  }
}

function getFallbacks() {
  if (state.mode === 'brother') {
    if (state.tension >= 40) {
      return [
        '……你今天话很多。不过，说吧。我听着。',
        '嗯。所以呢。',
        '别用那种语气跟我说话。……我会当真的。',
        '我知道。我一直都知道。',
        '你继续说。我在。'
      ];
    }
    return [
      '嗯，我在听。',
      '怎么了？说吧。',
      '别慌啊。有什么事慢慢说。',
      '你要是没事，就过来坐着。',
      '嗯。所以呢？',
      '这种事，下次直接告诉我。不用自己扛。',
      '……你今天话怎么这么多。不过，说吧。'
    ];
  } else {
    if (state.tension >= 50) {
      return [
        '说下去。我在听。',
        '……你知道自己在说什么吗。',
        '你最好是有正事。',
        '再往下说，我就当你是认真的了。',
        '嗯。继续。'
      ];
    }
    return [
      '说下去。',
      '……我在。',
      '嗯。还有什么。',
      '你知道的，我不喜欢重复。',
      '你就这么想靠近我？',
      '……说吧。趁我还愿意听。'
    ];
  }
}

// ========== 模式切换 ==========
function switchMode(mode) {
  if (mode === state.mode) return;
  state.mode = mode;

  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.mode === mode);
  });

  addSystemMsg(mode === 'brother' ? '切换至 · 日常模式' : '切换至 · 执舰官频道');
  updateStatusText();

  setTimeout(() => {
    if (mode === 'brother') {
      addXiaMsg('……怎么突然叫我哥了。行吧，过来。饭在锅里。', 400);
    } else {
      addXiaMsg('频道加密完毕。……你最好是有正事。', 400);
    }
  }, 350);

  updateQuickOptions();
}

// ========== 快捷选项 ==========
function updateQuickOptions() {
  let options;
  if (state.mode === 'brother') {
    options = [
      { text: '今天吃什么', cls: '' },
      { text: '我想你了', cls: '' },
      { text: '小时候的事', cls: 'special' },
      { text: '晚安', cls: '' },
      { text: '我有点害怕', cls: '' }
    ];
  } else {
    options = [
      { text: '远空舰队的情况', cls: '' },
      { text: '关于EVER', cls: '' },
      { text: '你为什么回来', cls: 'special' },
      { text: '我不想走', cls: '' },
      { text: '关于那条航线', cls: '' }
    ];
  }

  quickOptions.innerHTML = '';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'quick-btn ' + opt.cls;
    btn.textContent = opt.text;
    btn.onclick = () => { userInput.value = opt.text; sendMessage(); };
    quickOptions.appendChild(btn);
  });
}

// ========== 初始化 ==========
function init() {
  chatArea.innerHTML = '';
  state.affection = 0;
  state.trust = 0;
  state.tension = 0;
  state.gravity = 0;
  state.turnCount = 0;
  state.triggeredMemories.clear();
  state.triggeredEvents.clear();
  state.chatLog = [];

  updateStats({});

  // 开场
  addSystemMsg('通讯建立 · 深空频道 · 引力场稳定');

  setTimeout(() => {
    addXiaMsg(
      state.mode === 'brother'
        ? '回来了？今天猎人协会又这么晚。饭在锅里，快去洗手。'
        : '通讯接通了。……这个时间，你不该在这里。',
      600
    );
  }, 800);

  updateQuickOptions();
}

// ========== 事件绑定 ==========
userInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') sendMessage();
});

eventOverlay.addEventListener('click', e => {
  if (e.target === eventOverlay) closeEvent();
});

// ========== 启动 ==========
init();

</script>
</body>
</html>
