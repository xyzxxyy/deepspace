<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>夏以昼 · 互动终端</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0e1a;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    overflow: hidden;
  }

  /* 星空背景 */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(2px 2px at 20% 30%, rgba(255,200,100,0.6), transparent),
      radial-gradient(1px 1px at 40% 70%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1.5px 1.5px at 60% 20%, rgba(255,180,80,0.4), transparent),
      radial-gradient(1px 1px at 80% 50%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1.5px 1.5px at 10% 80%, rgba(255,200,100,0.3), transparent),
      radial-gradient(1px 1px at 70% 90%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 50% 45%, rgba(255,180,80,0.3), transparent),
      radial-gradient(2px 2px at 90% 15%, rgba(255,200,100,0.5), transparent);
    pointer-events: none;
    z-index: 0;
  }

  .terminal {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 680px;
    background: rgba(12, 16, 28, 0.92);
    border: 1px solid rgba(180, 140, 80, 0.35);
    border-radius: 12px;
    box-shadow:
      0 0 40px rgba(200, 150, 70, 0.08),
      0 0 80px rgba(100, 80, 180, 0.06),
      inset 0 0 60px rgba(0,0,0,0.5);
    overflow: hidden;
  }

  /* 顶部栏 */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    background: linear-gradient(135deg, rgba(30,25,50,0.9), rgba(20,18,40,0.9));
    border-bottom: 1px solid rgba(180, 140, 80, 0.25);
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: linear-gradient(135deg, #7b5ea7, #d4933a);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    border: 2px solid rgba(200, 160, 80, 0.5);
    flex-shrink: 0;
  }

  .header-info h1 {
    font-size: 15px;
    color: #e8d5a8;
    font-weight: 600;
    letter-spacing: 1px;
  }

  .header-info .status {
    font-size: 11px;
    color: #8a7a5a;
    display: flex;
    align-items: center;
    gap: 5px;
    margin-top: 2px;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #5ad87a;
    box-shadow: 0 0 6px #5ad87a;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* 状态切换按钮 */
  .mode-switch {
    display: flex;
    background: rgba(255,255,255,0.05);
    border-radius: 20px;
    padding: 3px;
    gap: 2px;
  }

  .mode-btn {
    padding: 5px 14px;
    border: none;
    border-radius: 17px;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.3s;
    background: transparent;
    color: #7a6a4a;
    letter-spacing: 0.5px;
  }

  .mode-btn.active {
    background: linear-gradient(135deg, #7b5ea7, #b8862d);
    color: #fff;
    box-shadow: 0 2px 8px rgba(180, 140, 80, 0.3);
  }

  /* 好感度 */
  .affection-bar {
    padding: 8px 20px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid rgba(180,140,80,0.1);
  }

  .affection-label {
    font-size: 10px;
    color: #7a6a4a;
    letter-spacing: 1px;
    white-space: nowrap;
  }

  .affection-track {
    flex: 1;
    height: 4px;
    background: rgba(255,255,255,0.06);
    border-radius: 2px;
    overflow: hidden;
  }

  .affection-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #7b5ea7, #d4933a, #ff6b8a);
    border-radius: 2px;
    transition: width 0.6s ease;
  }

  .affection-value {
    font-size: 10px;
    color: #d4933a;
    min-width: 28px;
    text-align: right;
  }

  /* 聊天区域 */
  .chat-area {
    height: 420px;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
  }

  .chat-area::-webkit-scrollbar { width: 4px; }
  .chat-area::-webkit-scrollbar-track { background: transparent; }
  .chat-area::-webkit-scrollbar-thumb {
    background: rgba(180,140,80,0.25);
    border-radius: 2px;
  }

  /* 消息气泡 */
  .msg {
    display: flex;
    gap: 10px;
    max-width: 85%;
    animation: fadeIn 0.35s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.xia {
    align-self: flex-start;
  }

  .msg.me {
    align-self: flex-end;
    flex-direction: row-reverse;
  }

  .msg .mini-avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: #fff;
  }

  .msg.xia .mini-avatar {
    background: linear-gradient(135deg, #7b5ea7, #d4933a);
  }

  .msg.me .mini-avatar {
    background: linear-gradient(135deg, #3a5a8a, #5a8aaa);
  }

  .bubble {
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 13.5px;
    line-height: 1.65;
    word-break: break-word;
  }

  .msg.xia .bubble {
    background: linear-gradient(135deg, rgba(50,40,75,0.85), rgba(35,30,55,0.85));
    border: 1px solid rgba(180,140,80,0.2);
    color: #e0d5c0;
    border-top-left-radius: 4px;
  }

  .msg.me .bubble {
    background: linear-gradient(135deg, rgba(30,55,85,0.85), rgba(25,45,70,0.85));
    border: 1px solid rgba(90,140,200,0.2);
    color: #c0d5e8;
    border-top-right-radius: 4px;
  }

  /* 打字指示器 */
  .typing-indicator {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 8px 14px;
  }

  .typing-indicator span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #8a7a5a;
    animation: typing 1.2s infinite;
  }

  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes typing {
    0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-4px); }
  }

  /* 输入区域 */
  .input-area {
    padding: 12px 20px 16px;
    border-top: 1px solid rgba(180,140,80,0.15);
    display: flex;
    gap: 8px;
    align-items: center;
    background: rgba(10,14,25,0.6);
  }

  .input-area input {
    flex: 1;
    padding: 10px 16px;
    border-radius: 22px;
    border: 1px solid rgba(180,140,80,0.2);
    background: rgba(255,255,255,0.04);
    color: #e0d5c0;
    font-size: 13px;
    outline: none;
    transition: border-color 0.3s;
  }

  .input-area input::placeholder {
    color: #5a4a3a;
  }

  .input-area input:focus {
    border-color: rgba(200,160,80,0.5);
    box-shadow: 0 0 12px rgba(180,140,80,0.1);
  }

  .input-area button {
    padding: 10px 20px;
    border-radius: 22px;
    border: none;
    background: linear-gradient(135deg, #7b5ea7, #b8862d);
    color: #fff;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.3s;
    white-space: nowrap;
    letter-spacing: 1px;
  }

  .input-area button:hover {
    box-shadow: 0 0 20px rgba(180,140,80,0.3);
    transform: translateY(-1px);
  }

  .input-area button:active {
    transform: translateY(0);
  }

  /* 快捷选项 */
  .quick-options {
    padding: 0 20px 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .quick-btn {
    padding: 5px 12px;
    border-radius: 14px;
    border: 1px solid rgba(180,140,80,0.25);
    background: rgba(255,255,255,0.03);
    color: #9a8a6a;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.25s;
  }

  .quick-btn:hover {
    background: rgba(180,140,80,0.12);
    color: #e8d5a8;
    border-color: rgba(180,140,80,0.5);
  }

  /* 场景特殊样式 */
  .scene-tag {
    text-align: center;
    font-size: 10px;
    color: #5a4a3a;
    letter-spacing: 2px;
    padding: 4px 0;
    position: relative;
  }

  .scene-tag::before,
  .scene-tag::after {
    content: '—';
    margin: 0 8px;
    color: #3a2a1a;
  }

  @media (max-width: 480px) {
    .terminal { border-radius: 8px; }
    .chat-area { height: 350px; padding: 12px 14px; }
    .header { padding: 10px 14px; }
    .input-area { padding: 10px 14px 12px; }
    .quick-options { padding: 0 14px 10px; }
    .bubble { font-size: 12.5px; padding: 8px 12px; }
  }
</style>
</head>
<body>

<div class="terminal">
  <!-- 顶部 -->
  <div class="header">
    <div class="header-left">
      <div class="avatar">昼</div>
      <div class="header-info">
        <h1>夏以昼</h1>
        <div class="status">
          <span class="status-dot"></span>
          <span id="statusText">远空舰队 · 通讯中</span>
        </div>
      </div>
    </div>
    <div class="mode-switch">
      <button class="mode-btn active" data-mode="brother" onclick="switchMode('brother')">哥哥</button>
      <button class="mode-btn" data-mode="officer" onclick="switchMode('officer')">执舰官</button>
    </div>
  </div>

  <!-- 好感度 -->
  <div class="affection-bar">
    <span class="affection-label">牵绊</span>
    <div class="affection-track">
      <div class="affection-fill" id="affectionFill"></div>
    </div>
    <span class="affection-value" id="affectionValue">0</span>
  </div>

  <!-- 聊天区 -->
  <div class="chat-area" id="chatArea"></div>

  <!-- 快捷选项 -->
  <div class="quick-options" id="quickOptions"></div>

  <!-- 输入区 -->
  <div class="input-area">
    <input type="text" id="userInput" placeholder="对他说些什么……" autocomplete="off">
    <button onclick="sendMessage()">发送</button>
  </div>
</div>

<script>
// =============================================
// 夏以昼 · 互动终端核心逻辑
// 人设依据：恋与深空官方设定
// 明暗反差双子座 / 温柔哥哥 / 偏执执舰官
// =============================================

// ---------- 状态 ----------
let currentMode = 'brother';
let affection = 0;
let chatHistory = [];
let isTyping = false;

// ---------- 关键词触发库 ----------
// 每个条目包含匹配关键词和对应回复
const keywordReplies = {
  brother: [
    { keys: ['喜欢', '爱你', '心动'], reply: '……你说什么？我没听清。再、再说一遍好不好。', affection: 5 },
    { keys: ['想你', '想念'], reply: '刚到家，累死我了。第一天当猎人不顺利吗？但结果还不错——看到你就不累了。', affection: 3 },
    { keys: ['饭', '饿', '吃'], reply: '红烧鸡翅，马上就好。去洗手，别偷吃。……好吧，就一块。', affection: 2 },
    { keys: ['奶奶'], reply: '如果你出了问题，我们月底就不能一起去看奶奶了。所以——不许受伤，知道吗？', affection: 3 },
    { keys: ['香菜'], reply: '你再把我当小孩，我就往你饭里下香菜。……开玩笑的，我知道你也不吃。', affection: 2 },
    { keys: ['回家', '回来'], reply: '嗯，回来了。家里有你在，才叫家。', affection: 4 },
    { keys: ['害怕', '怕'], reply: '怕什么。我在呢。所有朝你打来的风雨，都不该出现在这个世界上。', affection: 4 },
    { keys: ['猫', '铃铛'], reply: '还记得小时候那只受伤的猫吗？我给它系了一个铃铛，它就再也逃不掉了。……你说，这样的铃铛，我是不是也该给你系一个？', affection: 5 },
    { keys: ['海棠'], reply: '海棠花开的时候，我就该回来了。……可是我迟到了，对不起。', affection: 4 },
    { keys: ['天行'], reply: '天行市没有无尽夏。……但我可以给你种一院子。', affection: 4 },
    { keys: ['军校', '飞行员', '飞机'], reply: 'FY-26，你小时候最喜欢的那架。后来，它陪我第一次试飞。', affection: 3 },
    { keys: ['生日快乐', '生日'], reply: '……你还记得啊。没什么想要的。你在这儿，就够了。', affection: 5 },
    { keys: ['谢谢'], reply: '跟我说什么谢谢。我不罩着你，难道还要别的人来？', affection: 2 },
    { keys: ['晚安', '睡了'], reply: '晚安。被子盖好，别踢。……要我讲睡前故事？行，过来。', affection: 3 },
    { keys: ['疼', '受伤'], reply: '受伤了？给我看看。……下次再这样，我就把你锁在家里。', affection: 4 },
    { keys: ['亲亲', '抱抱', '抱'], reply: '……你知不知道自己在说什么。', affection: 5 },
  ],
  officer: [
    { keys: ['喜欢', '爱你', '心动'], reply: '你以为我会一直扮演你的好哥哥？这种过家家的游戏，我早就玩腻了。', affection: 5 },
    { keys: ['想你', '想念'], reply: '想我？那你为什么不用床头的那个装置。……我每天都在等。', affection: 4 },
    { keys: ['权限', '密码'], reply: '权限密码是「when u come back」和你的生日。……别问为什么。', affection: 4 },
    { keys: ['EVER', '集团'], reply: 'EVER的事，你不要插手。那些觊觎你力量的人，不论是谁，都该消失。', affection: 3 },
    { keys: ['回来', '回家'], reply: '回不去了。至少……现在的我，回不去了。但你可以留在这里。跟我过一百年。', affection: 5 },
    { keys: ['害怕', '怕'], reply: '怕我？……也好。你该怕我。', affection: 3 },
    { keys: ['猫', '铃铛'], reply: '那个铃铛。我一直在想，什么时候给你系上。现在，你觉得呢？', affection: 5 },
    { keys: ['爆炸', '死'], reply: '可惜，我早就已经死过一次了——不会再死一次。', affection: 4 },
    { keys: ['天行'], reply: '天行到临空的距离太远了。……所以我建了那条航道。为了回来。', affection: 4 },
    { keys: ['军校', '飞行员', '飞机'], reply: '毕业考核那次穿越深空隧道……我回来了。但回来的，已经不是原来的夏以昼了。', affection: 3 },
    { keys: ['生日'], reply: '生日那天打给你，只是想多和你说说话。……你不记得了？', affection: 4 },
    { keys: ['谢谢'], reply: '不需要。你愿意给的，就是我想要的。你想得到的，就是我愿意付出的。', affection: 3 },
    { keys: ['晚安', '睡了'], reply: '睡吧。我在这儿看着。……放心，不会有人靠近。', affection: 3 },
    { keys: ['疼', '受伤'], reply: '谁碰的你。告诉我是谁。……算了，不管是谁，我都会找到他。', affection: 5 },
    { keys: ['离开', '走'], reply: '你觉得自己长大了……就要松开这只手了吗？当年不是你先牵住的吗。', affection: 5 },
  ]
};

// ---------- 模式专属回复 ----------
const modeResponses = {
  brother: {
    greeting: '回来了？今天猎人协会又这么晚。饭在锅里，快去洗手。',
    fallback: [
      '嗯，我在听。',
      '怎么了？说吧。',
      '……你今天话怎么这么多。不过，说吧，我听着。',
      '别慌啊。有什么事慢慢说。',
      '你要是没事，就过来吃饭。要是没胃口……那也过来坐着。',
      '嗯。所以呢？',
      '这种事，下次直接告诉我。不用自己扛。',
    ],
    idleReplies: [
      '怎么不说话？',
      '又在发呆？',
      '……过来，坐我旁边。',
    ]
  },
  officer: {
    greeting: '通讯接通了。……这个时间，你不该在这里。',
    fallback: [
      '说下去。',
      '……我在。',
      '嗯。还有什么。',
      '你知道的，我不喜欢重复。',
      '你就这么想靠近我？',
      '……说吧。趁我还愿意听。',
    ],
    idleReplies: [
      '沉默？也好。有时候不说话，比说错话好。',
      '你在想什么。……不用回答。',
      '不说了？那我就当你是默认了。',
    ]
  }
};

// ---------- 场景事件 ----------
const sceneEvents = {
  brother: [
    { threshold: 0, text: '天色暗了下来，厨房里传来红烧鸡翅的香气。' },
    { threshold: 20, text: '客厅的灯是暖黄色的。他坐在沙发上，把一条毯子搭在你腿上。' },
    { threshold: 40, text: '海棠花从窗外的枝头落了一瓣，他伸手替你拂去肩上的花瓣。' },
    { threshold: 60, text: '他靠在门框上，低头看着你，眼神比平时多了些什么。' },
    { threshold: 80, text: '“过来。”他的声音低了一些。你走过去的时候，他伸出手，把你圈在怀里。' },
  ],
  officer: [
    { threshold: 0, text: '远空舰队的控制室里，全息屏幕的蓝光映在他的制服上。' },
    { threshold: 20, text: '他站在舰桥的舷窗前，背影被星海的光芒勾勒出冷硬的轮廓。' },
    { threshold: 40, text: '他转过身，紫橙渐变的瞳孔在暗光里显得格外锐利。' },
    { threshold: 60, text: '“你知不知道，你站在我面前的样子——”他顿了顿，“算了。你不需要知道。”' },
    { threshold: 80, text: '他走近了一步。引力控制的能力在你周围微微波动，像是无形的桎梏。' },
  ]
};

let triggeredScenes = new Set();

// ---------- 初始化 ----------
const chatArea = document.getElementById('chatArea');
const userInput = document.getElementById('userInput');
const quickOptions = document.getElementById('quickOptions');
const affectionFill = document.getElementById('affectionFill');
const affectionValue = document.getElementById('affectionValue');
const statusText = document.getElementById('statusText');

function init() {
  chatArea.innerHTML = '';
  triggeredScenes.clear();
  affection = 0;
  updateAffection();
  addScene('系统初始化 · 通讯已建立');
  setTimeout(() => {
    addXiaMessage(getGreeting());
    updateQuickOptions();
  }, 500);
}

function getGreeting() {
  return modeResponses[currentMode].greeting;
}

// ---------- 添加消息 ----------
function addXiaMessage(text, delay) {
  if (delay) {
    showTyping();
    setTimeout(() => {
      hideTyping();
      doAddXiaMessage(text);
    }, delay);
  } else {
    doAddXiaMessage(text);
  }
}

function doAddXiaMessage(text) {
  const div = document.createElement('div');
  div.className = 'msg xia';
  div.innerHTML = `
    <div class="mini-avatar">昼</div>
    <div class="bubble">${text}</div>
  `;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
  chatHistory.push({ role: 'xia', text });
}

function addMeMessage(text) {
  const div = document.createElement('div');
  div.className = 'msg me';
  div.innerHTML = `
    <div class="mini-avatar">你</div>
    <div class="bubble">${text}</div>
  `;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
  chatHistory.push({ role: 'me', text });
}

function addScene(text) {
  const div = document.createElement('div');
  div.className = 'scene-tag';
  div.textContent = text;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

// ---------- 打字指示器 ----------
let typingEl = null;

function showTyping() {
  if (typingEl) return;
  isTyping = true;
  typingEl = document.createElement('div');
  typingEl.className = 'msg xia';
  typingEl.innerHTML = `
    <div class="mini-avatar">昼</div>
    <div class="bubble">
      <div class="typing-indicator">
        <span></span><span></span><span></span>
      </div>
    </div>
  `;
  chatArea.appendChild(typingEl);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function hideTyping() {
  if (typingEl) {
    typingEl.remove();
    typingEl = null;
  }
  isTyping = false;
}

// ---------- 好感度 ----------
function updateAffection() {
  const pct = Math.min(affection, 100);
  affectionFill.style.width = pct + '%';
  affectionValue.textContent = affection;

  // 检查场景事件
  const scenes = sceneEvents[currentMode];
  for (const scene of scenes) {
    if (affection >= scene.threshold && !triggeredScenes.has(scene.threshold)) {
      triggeredScenes.add(scene.threshold);
      setTimeout(() => addScene(scene.text), 800);
    }
  }

  // 状态文字
  if (affection >= 80) {
    statusText.textContent = currentMode === 'brother' ? '远空舰队 · 牵绊极深' : '远空舰队 · 无法松开';
  } else if (affection >= 40) {
    statusText.textContent = '远空舰队 · 信号稳定';
  }
}

// ---------- 模式切换 ----------
function switchMode(mode) {
  if (mode === currentMode) return;
  currentMode = mode;

  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.mode === mode);
  });

  statusText.textContent = mode === 'brother' ? '远空舰队 · 通讯中' : '远空舰队 · 加密频道';
  addScene(mode === 'brother' ? '切换至 · 日常模式' : '切换至 · 执舰官频道');

  setTimeout(() => {
    addXiaMessage(mode === 'brother'
      ? '……怎么突然叫我哥了。行吧，过来。'
      : '频道加密完毕。……你最好是有正事。'
    );
  }, 300);

  updateQuickOptions();
}

// ---------- 快捷选项 ----------
function updateQuickOptions() {
  const options = currentMode === 'brother'
    ? ['今天吃什么', '我有点想你', '陪我聊聊天', '晚安']
    : ['远空舰队的情况', '关于EVER', '你为什么回来', '我不想走'];

  quickOptions.innerHTML = '';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'quick-btn';
    btn.textContent = opt;
    btn.onclick = () => {
      userInput.value = opt;
      sendMessage();
    };
    quickOptions.appendChild(btn);
  });
}

// ---------- 发送消息 ----------
function sendMessage() {
  const text = userInput.value.trim();
  if (!text || isTyping) return;

  userInput.value = '';
  addMeMessage(text);

  // 匹配关键词
  const replies = keywordReplies[currentMode];
  let matched = null;

  for (const item of replies) {
    if (item.keys.some(k => text.includes(k))) {
      matched = item;
      break;
    }
  }

  const delay = 600 + Math.random() * 800;

  if (matched) {
    setTimeout(() => {
      addXiaMessage(matched.reply, 400);
      affection += matched.affection;
      updateAffection();
    }, delay);
  } else {
    const fallbacks = modeResponses[currentMode].fallback;
    const reply = fallbacks[Math.floor(Math.random() * fallbacks.length)];
    setTimeout(() => {
      addXiaMessage(reply, 500);
      affection += 1;
      updateAffection();
    }, delay);
  }
}

// ---------- 事件绑定 ----------
userInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') sendMessage();
});

// ---------- 启动 ----------
init();

</script>
