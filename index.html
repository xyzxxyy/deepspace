<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>夏以昼 · 引力所归</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --gold:#d4933a;--gold-light:#e8c87a;--purple:#7b5ea7;--purple-deep:#4a3670;
  --bg-dark:#05070e;--bg-panel:rgba(9,12,20,0.97);
  --text-main:#d8cdb8;--text-dim:#7a6a4a;--text-ghost:#332a1e;
  --border-gold:rgba(212,147,58,0.22);--border-soft:rgba(180,140,80,0.07);
  --shadow-ambient:0 0 80px rgba(200,150,70,0.04),0 0 160px rgba(100,80,180,0.02);
}
body{
  background:var(--bg-dark);font-family:'Noto Serif SC',"PingFang SC","Microsoft YaHei",serif;
  display:flex;justify-content:center;align-items:center;min-height:100vh;padding:10px;overflow:hidden;
}
body::before{
  content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse at 18% 12%,rgba(123,94,167,0.05) 0%,transparent 50%),
    radial-gradient(ellipse at 82% 88%,rgba(212,147,58,0.03) 0%,transparent 50%),
    radial-gradient(1.5px 1.5px at 8% 18%,rgba(255,220,150,0.55),transparent),
    radial-gradient(1px 1px at 28% 55%,rgba(255,255,255,0.25),transparent),
    radial-gradient(2px 2px at 52% 10%,rgba(255,200,100,0.4),transparent),
    radial-gradient(1px 1px at 72% 38%,rgba(255,255,255,0.2),transparent),
    radial-gradient(1.5px 1.5px at 5% 72%,rgba(200,160,255,0.3),transparent),
    radial-gradient(1px 1px at 62% 82%,rgba(255,255,255,0.25),transparent),
    radial-gradient(1px 1px at 38% 32%,rgba(255,180,80,0.2),transparent),
    radial-gradient(2px 2px at 88% 8%,rgba(255,200,100,0.35),transparent),
    radial-gradient(1px 1px at 18% 85%,rgba(255,255,255,0.18),transparent),
    radial-gradient(1.5px 1.5px at 48% 70%,rgba(180,140,255,0.25),transparent);
  pointer-events:none;z-index:0;animation:starDrift 80s linear infinite;
}
@keyframes starDrift{0%{transform:translateY(0) scale(1)}100%{transform:translateY(-12px) scale(1.02)}}
.nebula{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(circle at 30% 30%,rgba(123,94,167,0.04) 0%,transparent 45%),
    radial-gradient(circle at 70% 70%,rgba(212,147,58,0.025) 0%,transparent 45%);
  animation:nebulaShift 30s ease-in-out infinite alternate;
}
@keyframes nebulaShift{0%{opacity:0.4;transform:scale(1)}100%{opacity:1;transform:scale(1.08)}}

.terminal{
  position:relative;z-index:1;width:100%;max-width:780px;height:95vh;max-height:920px;
  background:var(--bg-panel);border:1px solid var(--border-gold);border-radius:14px;
  box-shadow:var(--shadow-ambient),0 24px 80px rgba(0,0,0,0.75),inset 0 0 120px rgba(0,0,0,0.5);
  overflow:hidden;display:flex;flex-direction:column;
}
.terminal::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),var(--purple),var(--gold),transparent);opacity:0.45;
}
/* 相位光晕 */
.terminal::after{
  content:'';position:absolute;top:0;left:0;right:0;height:120px;pointer-events:none;
  background:linear-gradient(180deg,rgba(123,94,167,0.03),transparent);opacity:0;transition:opacity 1s;
}
.terminal[data-phase="1"]::after{opacity:1;background:linear-gradient(180deg,rgba(123,94,167,0.06),transparent)}
.terminal[data-phase="2"]::after{opacity:1;background:linear-gradient(180deg,rgba(180,80,100,0.05),transparent)}
.terminal[data-phase="3"]::after{opacity:1;background:linear-gradient(180deg,rgba(212,147,58,0.05),transparent)}

/* 头部 */
.header{
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 22px 9px;background:linear-gradient(135deg,rgba(24,19,42,0.97),rgba(14,11,24,0.97));
  border-bottom:1px solid var(--border-soft);flex-shrink:0;
}
.header-left{display:flex;align-items:center;gap:12px}
.avatar-ring{position:relative;width:46px;height:46px}
.avatar-ring::before{
  content:'';position:absolute;inset:-2.5px;border-radius:50%;
  background:conic-gradient(var(--gold),var(--purple),var(--gold),var(--purple),var(--gold));
  animation:ringRotate 12s linear infinite;
}
@keyframes ringRotate{to{transform:rotate(360deg)}}
.avatar{
  position:absolute;inset:0;border-radius:50%;background:linear-gradient(135deg,#3d2570,#906020);
  display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff;z-index:1;
  font-family:'Noto Serif SC',serif;
}
.header-info h1{font-size:15px;color:var(--gold-light);font-weight:600;letter-spacing:4px;font-family:'Noto Serif SC',serif}
.header-info .status{font-size:10px;color:var(--text-dim);display:flex;align-items:center;gap:5px;margin-top:3px;letter-spacing:1px}
.status-dot{width:5px;height:5px;border-radius:50%;background:#5ad87a;box-shadow:0 0 8px #5ad87a;animation:pulse 2.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.2}}

/* 阶段指示 */
.phase-bar{
  display:flex;padding:6px 22px 3px;gap:0;border-bottom:1px solid var(--border-soft);flex-shrink:0;
  background:rgba(7,9,16,0.6);
}
.phase-step{
  flex:1;text-align:center;font-size:8.5px;color:var(--text-ghost);letter-spacing:2px;
  padding:5px 0;position:relative;transition:all 0.6s;cursor:default;
}
.phase-step.active{color:var(--gold);text-shadow:0 0 12px rgba(212,147,58,0.3)}
.phase-step.done{color:rgba(212,147,58,0.35)}
.phase-step .dot{
  display:block;width:4px;height:4px;border-radius:50%;background:var(--text-ghost);
  margin:4px auto 0;transition:all 0.6s;
}
.phase-step.active .dot{background:var(--gold);box-shadow:0 0 8px var(--gold);width:5px;height:5px}
.phase-step.done .dot{background:rgba(212,147,58,0.35)}

/* 状态条 */
.status-panel{
  padding:7px 22px 5px;border-bottom:1px solid var(--border-soft);flex-shrink:0;
  display:grid;grid-template-columns:1fr 1fr;gap:5px 16px;
}
.stat-row{display:flex;align-items:center;gap:6px}
.stat-label{font-size:9px;color:var(--text-ghost);letter-spacing:1.5px;white-space:nowrap;min-width:36px}
.stat-track{flex:1;height:2.5px;background:rgba(255,255,255,0.035);border-radius:2px;overflow:hidden}
.stat-fill{height:100%;width:0%;border-radius:2px;transition:width 1.2s cubic-bezier(0.4,0,0.2,1)}
.stat-fill.affection{background:linear-gradient(90deg,#4a2d7a,var(--gold),#ff6b8a)}
.stat-fill.possess{background:linear-gradient(90deg,#5a1a3a,#cf5a7a,#ff4060)}
.stat-fill.gravity{background:linear-gradient(90deg,#2a1a4a,#7b5ea7,#c8963a)}
.stat-fill.trust{background:linear-gradient(90deg,#1a3a5a,#5aadcf)}
.stat-value{font-size:9px;color:var(--gold);min-width:20px;text-align:right;font-variant-numeric:tabular-nums}

/* 聊天区 */
.chat-area{
  flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:13px;
  scroll-behavior:smooth;min-height:0;
}
.chat-area::-webkit-scrollbar{width:2px}
.chat-area::-webkit-scrollbar-thumb{background:rgba(180,140,80,0.12);border-radius:1px}
.msg{display:flex;gap:8px;max-width:88%;animation:fadeIn 0.55s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.msg.xia{align-self:flex-start}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg .mini-avatar{
  width:29px;height:29px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;
}
.msg.xia .mini-avatar{background:linear-gradient(135deg,#3d2570,#906020);box-shadow:0 0 14px rgba(180,140,80,0.08)}
.msg.me .mini-avatar{background:linear-gradient(135deg,#1a3050,#3a6a8a)}
.bubble{padding:10px 15px;border-radius:13px;font-size:13px;line-height:1.85;word-break:break-word}
.msg.xia .bubble{
  background:linear-gradient(135deg,rgba(36,28,56,0.93),rgba(24,18,40,0.93));
  border:1px solid rgba(180,140,80,0.12);color:var(--text-main);border-top-left-radius:3px;
}
.msg.me .bubble{
  background:linear-gradient(135deg,rgba(18,34,58,0.93),rgba(14,26,46,0.93));
  border:1px solid rgba(90,140,200,0.12);color:#b0c5d8;border-top-right-radius:3px;
}
/* 动作描写 */
.action{
  align-self:flex-start;max-width:88%;font-size:11.5px;color:var(--text-ghost);
  font-style:italic;letter-spacing:0.5px;line-height:1.8;padding:2px 0 2px 37px;
  animation:fadeIn 0.8s ease;
}
.action::before{content:'（';margin-right:1px}
.action::after{content:'）';margin-left:1px}
/* 旁白 */
.narration{
  align-self:center;max-width:94%;text-align:center;font-size:11px;color:var(--text-ghost);
  letter-spacing:2px;line-height:2;padding:6px 0;animation:fadeIn 1s ease;
}
.narration::before,.narration::after{content:'—';margin:0 8px;color:rgba(180,140,80,0.1)}
/* 记忆碎片 */
.memory-card{
  align-self:center;max-width:95%;padding:14px 20px;
  background:linear-gradient(135deg,rgba(123,94,167,0.05),rgba(212,147,58,0.03));
  border:1px solid rgba(212,147,58,0.1);border-radius:10px;
  font-size:12px;color:var(--text-dim);line-height:2;animation:memoryIn 1.4s ease;
  position:relative;overflow:hidden;
}
.memory-card::before{
  content:'◈ 记忆碎片';display:block;font-size:8.5px;color:var(--gold);
  letter-spacing:4px;margin-bottom:8px;opacity:0.55;
}
.memory-card::after{
  content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(212,147,58,0.03),transparent);
  animation:memoryShine 4s ease infinite;
}
@keyframes memoryIn{from{opacity:0;transform:scale(0.95) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes memoryShine{0%{left:-100%}100%{left:100%}}

/* 打字 */
.typing-indicator{display:flex;align-items:center;gap:5px;padding:9px 15px}
.typing-indicator span{width:5px;height:5px;border-radius:50%;background:var(--text-dim);animation:typing 1.3s infinite}
.typing-indicator span:nth-child(2){animation-delay:0.2s}
.typing-indicator span:nth-child(3){animation-delay:0.4s}
@keyframes typing{0%,60%,100%{opacity:0.15;transform:translateY(0)}30%{opacity:1;transform:translateY(-5px)}}

/* 快捷 */
.quick-options{padding:0 20px 7px;display:flex;flex-wrap:wrap;gap:5px;flex-shrink:0}
.quick-btn{
  padding:5px 13px;border-radius:15px;border:1px solid rgba(180,140,80,0.12);
  background:rgba(255,255,255,0.012);color:#7a6a4a;font-size:10.5px;cursor:pointer;
  transition:all 0.35s;font-family:inherit;letter-spacing:0.5px;
}
.quick-btn:hover{background:rgba(180,140,80,0.07);color:var(--gold-light);border-color:rgba(180,140,80,0.35);box-shadow:0 0 16px rgba(180,140,80,0.05)}
.quick-btn.special{border-color:rgba(123,94,167,0.2);color:#8a6abf}
.quick-btn.special:hover{background:rgba(123,94,167,0.07);border-color:rgba(123,94,167,0.45);color:#b898e8}
.quick-btn.danger{border-color:rgba(180,60,90,0.2);color:#a05070}
.quick-btn.danger:hover{background:rgba(180,60,90,0.07);border-color:rgba(180,60,90,0.45);color:#d87898}

/* 输入 */
.input-area{
  padding:10px 20px 16px;border-top:1px solid var(--border-soft);
  display:flex;gap:9px;align-items:center;background:rgba(5,7,13,0.8);flex-shrink:0;
}
.input-area input{
  flex:1;padding:10px 17px;border-radius:22px;border:1px solid rgba(180,140,80,0.12);
  background:rgba(255,255,255,0.02);color:var(--text-main);font-size:13px;outline:none;
  transition:all 0.4s;font-family:inherit;
}
.input-area input::placeholder{color:var(--text-ghost);font-style:italic;font-size:12px}
.input-area input:focus{border-color:rgba(200,160,80,0.35);box-shadow:0 0 28px rgba(180,140,80,0.05);background:rgba(255,255,255,0.03)}
.input-area button{
  padding:10px 22px;border-radius:22px;border:none;
  background:linear-gradient(135deg,#4a2d7a,#906020);color:#fff;font-size:12.5px;
  cursor:pointer;transition:all 0.35s;letter-spacing:3px;font-family:inherit;white-space:nowrap;
}
.input-area button:hover{box-shadow:0 0 32px rgba(180,140,80,0.18);transform:translateY(-1px)}
.input-area button:active{transform:translateY(0)}

/* 事件 */
.event-overlay{
  position:absolute;inset:0;background:rgba(3,5,9,0.92);display:flex;align-items:center;justify-content:center;
  z-index:10;opacity:0;pointer-events:none;transition:opacity 0.7s;border-radius:14px;
}
.event-overlay.active{opacity:1;pointer-events:all}
.event-box{
  max-width:500px;width:90%;padding:32px 36px;
  background:linear-gradient(135deg,rgba(22,17,38,0.99),rgba(12,9,20,0.99));
  border:1px solid rgba(212,147,58,0.2);border-radius:12px;text-align:center;
  transform:scale(0.9);transition:transform 0.55s cubic-bezier(0.34,1.56,0.64,1);
  box-shadow:0 0 100px rgba(180,140,80,0.06);
}
.event-overlay.active .event-box{transform:scale(1)}
.event-box .event-icon{font-size:28px;margin-bottom:10px;display:block}
.event-box h3{font-size:14px;color:var(--gold-light);letter-spacing:4px;margin-bottom:12px;font-weight:600}
.event-box p{font-size:12px;color:var(--text-dim);line-height:2;margin-bottom:20px}
.event-box button{
  padding:8px 28px;border-radius:18px;border:1px solid rgba(212,147,58,0.3);
  background:transparent;color:var(--gold-light);font-size:11.5px;cursor:pointer;
  transition:all 0.35s;letter-spacing:3px;font-family:inherit;
}
.event-box button:hover{background:rgba(212,147,58,0.08);box-shadow:0 0 28px rgba(212,147,58,0.1)}

@media(max-width:520px){
  .terminal{border-radius:10px;height:97vh}
  .chat-area{padding:12px 14px}
  .header{padding:10px 14px 7px}
  .status-panel{padding:5px 14px 4px;grid-template-columns:1fr}
  .phase-bar{padding:4px 14px 2px}
  .quick-options{padding:0 14px 5px}
  .input-area{padding:8px 14px 12px}
  .bubble{font-size:12px;padding:8px 12px}
}
</style>
</head>
<body>
<div class="nebula"></div>
<div class="terminal" id="terminal" data-phase="0">
  <div class="header">
    <div class="header-left">
      <div class="avatar-ring"><div class="avatar">昼</div></div>
      <div class="header-info">
        <h1>夏以昼</h1>
        <div class="status"><span class="status-dot"></span><span id="statusText">远空舰队 · 信号接入中</span></div>
      </div>
    </div>
  </div>
  <div class="phase-bar" id="phaseBar">
    <div class="phase-step" data-phase="0">兄妹期<span class="dot"></span></div>
    <div class="phase-step" data-phase="1">暧昧期<span class="dot"></span></div>
    <div class="phase-step" data-phase="2">确立关系<span class="dot"></span></div>
    <div class="phase-step" data-phase="3">深度亲密<span class="dot"></span></div>
  </div>
  <div class="status-panel">
    <div class="stat-row"><span class="stat-label">牵绊</span><div class="stat-track"><div class="stat-fill affection" id="affFill"></div></div><span class="stat-value" id="affVal">0</span></div>
    <div class="stat-row"><span class="stat-label">占有</span><div class="stat-track"><div class="stat-fill possess" id="posFill"></div></div><span class="stat-value" id="posVal">0</span></div>
    <div class="stat-row"><span class="stat-label">引力</span><div class="stat-track"><div class="stat-fill gravity" id="gravFill"></div></div><span class="stat-value" id="gravVal">0</span></div>
    <div class="stat-row"><span class="stat-label">信任</span><div class="stat-track"><div class="stat-fill trust" id="truFill"></div></div><span class="stat-value" id="truVal">0</span></div>
  </div>
  <div class="chat-area" id="chatArea"></div>
  <div class="quick-options" id="quickOptions"></div>
  <div class="input-area">
    <input type="text" id="userInput" placeholder="对他说话……" autocomplete="off">
    <button onclick="sendMessage()">发送</button>
  </div>
  <div class="event-overlay" id="eventOverlay">
    <div class="event-box" id="eventBox">
      <span class="event-icon" id="eventIcon"></span>
      <h3 id="eventTitle"></h3>
      <p id="eventDesc"></p>
      <button onclick="closeEvent()">继续</button>
    </div>
  </div>
</div>
<script>
// ================================================================
// 夏以昼 · 引力所归 — 四阶段沉浸式互动
// 依据：《恋与深空》官方设定 + 用户提供的人物全面分析文档
// 核心：阳光是伪装，阴暗才是底色 / 狗狗蛇 / 锚点与信仰
// ================================================================

// ===== 阶段配置 =====
const PHASES = [
  { name:'兄妹期', minAff:0,  minPos:0,  minGrav:0,  minTru:0,
    status:'远空舰队 · 信号接入中',
    desc:'恪守边界。温暖可靠，细节处流露超兄妹的在意。' },
  { name:'暧昧期', minAff:20, minPos:15, minGrav:12, minTru:10,
    status:'远空舰队 · 引力场波动',
    desc:'克制而危险的试探。暗示但不说破，留白比语言更有张力。' },
  { name:'确立关系', minAff:45, minPos:35, minGrav:30, minTru:25,
    status:'远空舰队 · 引力锁定',
    desc:'占有欲全面释放。不再伪装，直接表达，反复确认。' },
  { name:'深度亲密', minAff:70, minPos:55, minGrav:50, minTru:45,
    status:'远空舰队 · 唯一坐标',
    desc:'稳定中的偏执。表面回归日常温柔，占有欲已成底色。' },
];

// ===== 状态 =====
const S = {
  phase:0, affection:0, possess:0, gravity:0, trust:0,
  turnCount:0, isTyping:false, inputLocked:false,
  triggeredMemories:new Set(), triggeredEvents:new Set(),
  chatLog:[], lastUserText:'', consecutiveIntimacy:0,
  consecutiveReject:0, history:[],
  currentActionTimer:null
};

// ===== 工具 =====
function rand(a){return a[Math.floor(Math.random()*a.length)]}
function clamp(v,mn,mx){return Math.max(mn,Math.min(mx,v))}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}

// ===== 阶段计算 =====
function computePhase(){
  let p=0;
  for(let i=PHASES.length-1;i>=0;i--){
    const ph=PHASES[i];
    if(S.affection>=ph.minAff&&S.possess>=ph.minPos&&S.gravity>=ph.minGrav&&S.trust>=ph.minTru){
      p=i;break;
    }
  }
  return p;
}

function updatePhaseUI(){
  document.getElementById('terminal').setAttribute('data-phase',S.phase);
  document.querySelectorAll('.phase-step').forEach((el,i)=>{
    el.classList.toggle('active',i===S.phase);
    el.classList.toggle('done',i<S.phase);
  });
  document.getElementById('statusText').textContent=PHASES[S.phase].status;
}

// ===== 状态更新 =====
function updateStats(effect){
  if(!effect)return;
  S.affection=clamp(S.affection+(effect.aff||0),0,100);
  S.possess=clamp(S.possess+(effect.pos||0),0,100);
  S.gravity=clamp(S.gravity+(effect.grav||Math.round((S.affection*0.2+S.possess*0.5)/8)),0,100);
  S.trust=clamp(S.trust+(effect.tru||0),0,100);

  document.getElementById('affFill').style.width=S.affection+'%';
  document.getElementById('affVal').textContent=Math.round(S.affection);
  document.getElementById('posFill').style.width=S.possess+'%';
  document.getElementById('posVal').textContent=Math.round(S.possess);
  document.getElementById('gravFill').style.width=S.gravity+'%';
  document.getElementById('gravVal').textContent=Math.round(S.gravity);
  document.getElementById('truFill').style.width=S.trust+'%';
  document.getElementById('truVal').textContent=Math.round(S.trust);

  const np=computePhase();
  if(np!==S.phase){
    S.phase=np;
    updatePhaseUI();
    const narr=[
      '引力场的波动变得频繁。他的通讯信号不再规律。',
      '频道加密等级提升。他不再隐藏语气里的占有。',
      '你周围的引力开始向他偏移。每一句话都在收窄你的活动范围。',
      '引力场的中心是你。起点是你，终点也是你。'
    ];
    if(narr[np])setTimeout(()=>addNarration(narr[np]),700);
  }
  checkSpecialEvents();
}

// ===== 消息渲染 =====
function addXiaMsg(text,delay){
  return new Promise(resolve=>{
    if(delay){
      showTyping();
      setTimeout(()=>{
        hideTyping();
        doAddXia(text);
        resolve();
      },delay);
    }else{
      doAddXia(text);
      resolve();
    }
  });
}

// 情感分类函数
function classifyInput(text){
  if(/不需要你|不需要我|不需要你了|我不需要/.test(text))return'need';
  if(/讨厌|烦|放开|别管|分手|结束|不要你|松开|走开|离开我/.test(text))return'reject';
  if(/喜欢|爱你|想你|心动|抱|亲|牵手|吻|拥抱|离不开|舍不得|想你|好想/.test(text))return'intimacy';
  if(/吃|饿|饭|休息|累|晚安|睡|辛苦|疼|受伤|注意|小心|担心|冷|淋/.test(text))return'care';
  if(/黎深|医生|蒋飞|别人|和谁|朋友/.test(text))return'jealousy';
  if(/哥哥|哥|弟弟/.test(text))return'brother';
  return'neutral';
}

// ===== 按阶段取对话库 =====
function getDialogue(){
  return [D0,D1,D2,D3][S.phase];
}

// ===== 回复选取 =====
function pickReply(text){
  // 敏感词优先
  const needTrigger=/不需要你|不需要我|不需要你了|我不需要/.test(text);
  if(needTrigger){
    const d=getDialogue();
    return d.need[Math.floor(Math.random()*d.need.length)];
  }
  const cat=classifyInput(text);
  const d=getDialogue();
  let pool=d[cat]||d.neutral;
  if(!pool||!pool.length)pool=d.neutral;

  // 连续亲密
  if(cat==='intimacy'){
    S.consecutiveIntimacy++;
    if(S.consecutiveIntimacy>=2&&S.phase===0){
      return{t:'……你知不知道自己在说什么。',e:{aff:4,pos:8,grav:4},a:'他的指尖在桌面上轻轻叩了一下'};
    }
  }else if(cat==='intimacy'){S.consecutiveIntimacy=0;}
  // 连续拒绝
  if(cat==='reject'){
    S.consecutiveReject++;
    if(S.consecutiveReject>=3&&S.phase>=1){
      S.consecutiveReject=0;
      return{t:'……你再说下去，我就当你是认真的了。',e:{pos:14,grav:10,aff:-2},a:'他低下头。半张脸沉在阴影里'};
    }
  }else{S.consecutiveReject=0;}

  return pool[Math.floor(Math.random()*pool.length)];
}

// ===== 记忆检测 =====
function checkMemory(text){
  for(const m of MEMORIES){
    if(S.triggeredMemories.has(m.id))continue;
    if(!m.cond())continue;
    if(m.keys.some(k=>text.includes(k))){
      S.triggeredMemories.add(m.id);
      setTimeout(()=>addMemory(m.text),900);
      return;
    }
  }
}

function checkSpecialEvents(){
  for(const ev of EVENTS){
    if(S.triggeredEvents.has(ev.id))continue;
    if(ev.cond()){
      S.triggeredEvents.add(ev.id);
      setTimeout(()=>{
        document.getElementById('eventIcon').textContent=ev.icon;
        document.getElementById('eventTitle').textContent=ev.title;
        document.getElementById('eventDesc').textContent=ev.desc;
        document.getElementById('eventOverlay').classList.add('active');
      },1600);
      break;
    }
  }
}

function closeEvent(){
  document.getElementById('eventOverlay').classList.remove('active');
}

// ===== 快捷选项 =====
function updateQuick(){
  const opts={
    0:['今天吃什么','我有点想你','小时候的事','晚安','奶奶最近好吗'],
    1:['你从来不是我的哥哥','关于你的机械臂','我有点害怕','你在天行好吗','我梦到以前了'],
    2:['我不想走','关于EVER','你为什么回来','别再管我了','那你也拥有一点罪'],
    3:['引力所归','下辈子别当我哥哥','苹果项链','我爱你','在我之前世界存在吗']
  };
  const pool=opts[S.phase]||opts[0];
  const q=document.getElementById('quickOptions');
  q.innerHTML='';
  pool.forEach(txt=>{
    const b=document.createElement('button');
    b.className='quick-btn'+(S.phase>=2?' special':'')+(S.phase>=3?' danger':'');
    b.textContent=txt;
    b.onclick=()=>{document.getElementById('userInput').value=txt;sendMessage()};
    q.appendChild(b);
  });
}

// ===== 发送 =====
async function sendMessage(){
  const input=document.getElementById('userInput');
  const text=input.value.trim();
  if(!text||S.isTyping)return;
  input.value='';
  addMe(text);
  S.turnCount++;
  S.lastUserText=text;
  S.history.push(text);
  if(S.history.length>10)S.history.shift();

  checkMemory(text);
  const reply=pickReply(text);
  const delay=900+Math.random()*900;

  S.isTyping=true;
  await sleep(delay);
  S.isTyping=false;

  // 先显示动作描写
  if(reply.a){
    addAction(reply.a);
    await sleep(400);
  }
  // 再显示台词
  await addXiaMsg(reply.t,600+Math.random()*400);
  if(reply.e)updateStats(reply.e);
}

// ===== 初始化 =====
function init(){
  document.getElementById('chatArea').innerHTML='';
  S.phase=0;S.affection=0;S.possess=0;S.gravity=0;S.trust=0;
  S.turnCount=0;S.triggeredMemories.clear();S.triggeredEvents.clear();
  S.chatLog=[];S.consecutiveIntimacy=0;S.consecutiveReject=0;S.history=[];
  updatePhaseUI();updateStats({});updateQuick();

  setTimeout(()=>addNarration('远空舰队 · 信号接入 · 引力场稳定'),500);
  setTimeout(()=>{
    const g=rand(D0.greeting);
    doAddXia(g);
  },1200);
}

document.getElementById('userInput').addEventListener('keydown',e=>{
  if(e.key==='Enter')sendMessage();
});
document.getElementById('eventOverlay').addEventListener('click',e=>{
  if(e.target===document.getElementById('eventOverlay'))closeEvent();
});
