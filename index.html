<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>夏以昼 · 引力所归</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --gold:#d4933a;--gold-light:#e8c87a;--purple:#7b5ea7;
  --bg-dark:#05070e;--bg-panel:rgba(9,12,20,0.97);
  --text-main:#d8cdb8;--text-dim:#7a6a4a;--text-ghost:#332a1e;
  --border-gold:rgba(212,147,58,0.22);--border-soft:rgba(180,140,80,0.07);
}
html,body{height:100%}
body{
  background:var(--bg-dark);
  font-family:'Noto Serif SC',"PingFang SC","Microsoft YaHei",serif;
  display:flex;justify-content:center;align-items:center;min-height:100vh;padding:10px;
  overflow:hidden;position:relative;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(1.5px 1.5px at 8% 18%,rgba(255,220,150,0.6),transparent),
    radial-gradient(1px 1px at 28% 55%,rgba(255,255,255,0.3),transparent),
    radial-gradient(2px 2px at 52% 10%,rgba(255,200,100,0.45),transparent),
    radial-gradient(1px 1px at 72% 38%,rgba(255,255,255,0.25),transparent),
    radial-gradient(1.5px 1.5px at 5% 72%,rgba(200,160,255,0.4),transparent),
    radial-gradient(1px 1px at 62% 82%,rgba(255,255,255,0.3),transparent),
    radial-gradient(1px 1px at 38% 32%,rgba(255,180,80,0.25),transparent),
    radial-gradient(2px 2px at 88% 8%,rgba(255,200,100,0.4),transparent),
    radial-gradient(1px 1px at 18% 85%,rgba(255,255,255,0.22),transparent),
    radial-gradient(1.5px 1.5px at 48% 70%,rgba(180,140,255,0.3),transparent);
}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(circle at 22% 28%,rgba(123,94,167,0.09) 0%,transparent 42%),
    radial-gradient(circle at 78% 72%,rgba(212,147,58,0.055) 0%,transparent 42%);
  animation:nebulaBreathe 18s ease-in-out infinite alternate;
  will-change:opacity;transform:translateZ(0);
}
@keyframes nebulaBreathe{0%{opacity:0.7}100%{opacity:1}}

.terminal{
  position:relative;z-index:1;width:100%;max-width:780px;height:95vh;max-height:920px;
  background:var(--bg-panel);border:1px solid var(--border-gold);border-radius:14px;
  box-shadow:0 0 80px rgba(200,150,70,0.06),0 0 160px rgba(100,80,180,0.035),
    0 24px 80px rgba(0,0,0,0.75),inset 0 0 120px rgba(0,0,0,0.5);
  overflow:hidden;display:flex;flex-direction:column;
}
.terminal::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),var(--purple),var(--gold),transparent);
  opacity:0.55;z-index:2;
}
.terminal::after{
  content:'';position:absolute;top:0;left:0;right:0;height:140px;pointer-events:none;
  background:linear-gradient(180deg,rgba(123,94,167,0.05),transparent);
  opacity:0;transition:opacity 1s;z-index:0;
}
.terminal[data-phase="1"]::after{opacity:1;background:linear-gradient(180deg,rgba(123,94,167,0.08),transparent)}
.terminal[data-phase="2"]::after{opacity:1;background:linear-gradient(180deg,rgba(180,80,100,0.06),transparent)}
.terminal[data-phase="3"]::after{opacity:1;background:linear-gradient(180deg,rgba(212,147,58,0.07),transparent)}

.header{
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 22px 9px;
  background:linear-gradient(135deg,rgba(26,20,46,0.98),rgba(14,11,24,0.98));
  border-bottom:1px solid var(--border-soft);flex-shrink:0;
  position:relative;z-index:1;
}
.header-left{display:flex;align-items:center;gap:12px}
.avatar-ring{position:relative;width:46px;height:46px;will-change:transform}
.avatar-ring::before{
  content:'';position:absolute;inset:-2.5px;border-radius:50%;
  background:conic-gradient(var(--gold),var(--purple),var(--gold),var(--purple),var(--gold));
  animation:ringRotate 14s linear infinite;transform:translateZ(0);
}
@keyframes ringRotate{to{transform:rotate(360deg) translateZ(0)}}
.avatar{
  position:absolute;inset:0;border-radius:50%;
  background:linear-gradient(135deg,#3d2570,#906020);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:700;color:#fff;z-index:1;
  box-shadow:inset 0 0 12px rgba(0,0,0,0.4);
}
.header-info h1{font-size:15px;color:var(--gold-light);font-weight:600;letter-spacing:4px;text-shadow:0 0 12px rgba(212,147,58,0.25)}
.header-info .status{font-size:10px;color:var(--text-dim);display:flex;align-items:center;gap:5px;margin-top:3px;letter-spacing:1px}
.status-dot{width:5px;height:5px;border-radius:50%;background:#5ad87a;box-shadow:0 0 8px #5ad87a;animation:pulse 3s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.35}}

.phase-bar{
  display:flex;padding:6px 22px 3px;gap:0;border-bottom:1px solid var(--border-soft);flex-shrink:0;
  background:rgba(7,9,16,0.6);position:relative;z-index:1;
}
.phase-step{
  flex:1;text-align:center;font-size:8.5px;color:var(--text-ghost);letter-spacing:2px;
  padding:5px 0;position:relative;transition:color 0.5s;
}
.phase-step.active{color:var(--gold);text-shadow:0 0 10px rgba(212,147,58,0.4)}
.phase-step.done{color:rgba(212,147,58,0.4)}
.phase-step .dot{
  display:block;width:4px;height:4px;border-radius:50%;background:var(--text-ghost);
  margin:4px auto 0;transition:all 0.5s;
}
.phase-step.active .dot{background:var(--gold);box-shadow:0 0 10px var(--gold);width:5px;height:5px}
.phase-step.done .dot{background:rgba(212,147,58,0.4)}

.status-panel{
  padding:7px 22px 5px;border-bottom:1px solid var(--border-soft);flex-shrink:0;
  display:grid;grid-template-columns:1fr 1fr;gap:5px 16px;position:relative;z-index:1;
}
.stat-row{display:flex;align-items:center;gap:6px}
.stat-label{font-size:9px;color:var(--text-ghost);letter-spacing:1.5px;white-space:nowrap;min-width:36px}
.stat-track{flex:1;height:2.5px;background:rgba(255,255,255,0.04);border-radius:2px;overflow:hidden}
.stat-fill{height:100%;width:0%;border-radius:2px;transition:width 0.9s cubic-bezier(0.4,0,0.2,1)}
.stat-fill.affection{background:linear-gradient(90deg,#4a2d7a,var(--gold),#ff6b8a);box-shadow:0 0 8px rgba(212,147,58,0.3)}
.stat-fill.possess{background:linear-gradient(90deg,#5a1a3a,#cf5a7a,#ff4060);box-shadow:0 0 8px rgba(207,90,122,0.3)}
.stat-fill.gravity{background:linear-gradient(90deg,#2a1a4a,#7b5ea7,#c8963a);box-shadow:0 0 8px rgba(123,94,167,0.3)}
.stat-fill.trust{background:linear-gradient(90deg,#1a3a5a,#5aadcf);box-shadow:0 0 8px rgba(90,173,207,0.25)}
.stat-value{font-size:9px;color:var(--gold);min-width:20px;text-align:right;font-variant-numeric:tabular-nums}

.chat-area{
  flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:13px;
  scroll-behavior:smooth;min-height:0;position:relative;z-index:1;
  overscroll-behavior:contain;
}
.chat-area::-webkit-scrollbar{width:2px}
.chat-area::-webkit-scrollbar-thumb{background:rgba(180,140,80,0.15);border-radius:1px}

.msg{display:flex;gap:8px;max-width:88%;animation:msgIn 0.4s cubic-bezier(0.16,1,0.3,1)}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.msg.xia{align-self:flex-start}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg .mini-avatar{
  width:29px;height:29px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:700;color:#fff;
}
.msg.xia .mini-avatar{background:linear-gradient(135deg,#3d2570,#906020);box-shadow:0 0 14px rgba(180,140,80,0.15),inset 0 0 8px rgba(0,0,0,0.3)}
.msg.me .mini-avatar{background:linear-gradient(135deg,#1a3050,#3a6a8a);box-shadow:0 0 10px rgba(90,140,200,0.1)}
.bubble{padding:10px 15px;border-radius:13px;font-size:13px;line-height:1.85;word-break:break-word}
.msg.xia .bubble{
  background:linear-gradient(135deg,rgba(40,30,62,0.94),rgba(24,18,40,0.94));
  border:1px solid rgba(180,140,80,0.14);color:var(--text-main);
  border-top-left-radius:3px;
  box-shadow:0 2px 12px rgba(0,0,0,0.25),inset 0 1px 0 rgba(255,255,255,0.02);
}
.msg.me .bubble{
  background:linear-gradient(135deg,rgba(20,38,65,0.94),rgba(14,26,46,0.94));
  border:1px solid rgba(90,140,200,0.14);color:#b0c5d8;
  border-top-right-radius:3px;
  box-shadow:0 2px 12px rgba(0,0,0,0.2),inset 0 1px 0 rgba(255,255,255,0.02);
}

/* 内心独白——新 */
.thought{
  align-self:flex-start;max-width:80%;font-size:11px;color:rgba(200,160,80,0.45);
  font-style:italic;line-height:1.9;padding:4px 0 4px 37px;
  animation:msgIn 0.5s cubic-bezier(0.16,1,0.3,1);
  border-left:1px solid rgba(180,140,80,0.15);margin-left:37px;padding-left:14px;
}
.thought::before{content:'· ';color:rgba(180,140,80,0.3)}

.action{
  align-self:flex-start;max-width:88%;font-size:11.5px;color:var(--text-ghost);
  font-style:italic;letter-spacing:0.5px;line-height:1.8;padding:2px 0 2px 37px;
  animation:msgIn 0.55s cubic-bezier(0.16,1,0.3,1);
}
.action::before{content:'（';margin-right:1px}
.action::after{content:'）';margin-left:1px}

.narration{
  align-self:center;max-width:94%;text-align:center;font-size:11px;color:var(--text-ghost);
  letter-spacing:2px;line-height:2;padding:6px 0;
  animation:msgIn 0.6s cubic-bezier(0.16,1,0.3,1);
}
.narration::before,.narration::after{content:'—';margin:0 8px;color:rgba(180,140,80,0.12)}

.memory-card{
  align-self:center;max-width:95%;padding:14px 20px;
  background:linear-gradient(135deg,rgba(123,94,167,0.07),rgba(212,147,58,0.04));
  border:1px solid rgba(212,147,58,0.14);border-radius:10px;
  font-size:12px;color:var(--text-dim);line-height:2;
  animation:memoryIn 1s cubic-bezier(0.16,1,0.3,1);
  position:relative;overflow:hidden;
  box-shadow:0 4px 20px rgba(0,0,0,0.3),inset 0 0 40px rgba(123,94,167,0.04);
}
.memory-card::before{
  content:'◈ 记忆碎片';display:block;font-size:8.5px;color:var(--gold);
  letter-spacing:4px;margin-bottom:8px;opacity:0.65;
}
.memory-card::after{
  content:'';position:absolute;top:0;left:0;width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(212,147,58,0.06),transparent);
  transform:translateX(-100%);animation:memoryShine 4s ease-in-out infinite;
  will-change:transform;pointer-events:none;
}
@keyframes memoryIn{from{opacity:0;transform:scale(0.96) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes memoryShine{0%{transform:translateX(-100%)}60%,100%{transform:translateX(100%)}}

.typing-indicator{display:flex;align-items:center;gap:5px;padding:9px 15px}
.typing-indicator span{width:5px;height:5px;border-radius:50%;background:var(--text-dim);animation:typing 1.3s infinite}
.typing-indicator span:nth-child(2){animation-delay:0.2s}
.typing-indicator span:nth-child(3){animation-delay:0.4s}
@keyframes typing{0%,60%,100%{opacity:0.2;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}

.quick-options{padding:0 20px 7px;display:flex;flex-wrap:wrap;gap:5px;flex-shrink:0;position:relative;z-index:1}
.quick-btn{
  padding:5px 13px;border-radius:15px;border:1px solid rgba(180,140,80,0.13);
  background:rgba(255,255,255,0.015);color:#7a6a4a;font-size:10.5px;cursor:pointer;
  transition:all 0.3s;font-family:inherit;letter-spacing:0.5px;
}
.quick-btn:hover{
  background:rgba(180,140,80,0.09);color:var(--gold-light);
  border-color:rgba(180,140,80,0.4);box-shadow:0 0 18px rgba(180,140,80,0.08);
  transform:translateY(-1px);
}
.quick-btn.special{border-color:rgba(123,94,167,0.22);color:#8a6abf}
.quick-btn.special:hover{background:rgba(123,94,167,0.1);border-color:rgba(123,94,167,0.5);color:#b898e8}
.quick-btn.danger{border-color:rgba(180,60,90,0.22);color:#a05070}
.quick-btn.danger:hover{background:rgba(180,60,90,0.1);border-color:rgba(180,60,90,0.5);color:#d87898}

.input-area{
  padding:10px 20px 16px;border-top:1px solid var(--border-soft);
  display:flex;gap:9px;align-items:center;background:rgba(5,7,13,0.8);
  flex-shrink:0;position:relative;z-index:1;
}
.input-area input{
  flex:1;padding:10px 17px;border-radius:22px;
  border:1px solid rgba(180,140,80,0.14);
  background:rgba(255,255,255,0.025);color:var(--text-main);
  font-size:13px;outline:none;transition:all 0.35s;font-family:inherit;
}
.input-area input::placeholder{color:var(--text-ghost);font-style:italic;font-size:12px}
.input-area input:focus{
  border-color:rgba(200,160,80,0.4);
  box-shadow:0 0 24px rgba(180,140,80,0.08),inset 0 0 12px rgba(180,140,80,0.03);
  background:rgba(255,255,255,0.04);
}
.input-area button{
  padding:10px 22px;border-radius:22px;border:none;
  background:linear-gradient(135deg,#4a2d7a,#906020);color:#fff;
  font-size:12.5px;cursor:pointer;transition:all 0.3s;
  letter-spacing:3px;font-family:inherit;white-space:nowrap;
  box-shadow:0 2px 14px rgba(123,94,167,0.2),inset 0 1px 0 rgba(255,255,255,0.1);
}
.input-area button:hover{box-shadow:0 0 32px rgba(180,140,80,0.25),inset 0 1px 0 rgba(255,255,255,0.15);transform:translateY(-1px)}
.input-area button:active{transform:translateY(0)}
.input-area button:disabled{opacity:0.4;cursor:not-allowed;transform:none}

.event-overlay{
  position:absolute;inset:0;background:rgba(3,5,9,0.92);
  display:flex;align-items:center;justify-content:center;
  z-index:10;opacity:0;pointer-events:none;
  transition:opacity 0.6s;border-radius:14px;backdrop-filter:blur(4px);
}
.event-overlay.active{opacity:1;pointer-events:all}
.event-box{
  max-width:500px;width:90%;padding:32px 36px;
  background:linear-gradient(135deg,rgba(24,18,42,0.99),rgba(12,9,20,0.99));
  border:1px solid rgba(212,147,58,0.25);border-radius:12px;text-align:center;
  transform:scale(0.92);transition:transform 0.5s cubic-bezier(0.34,1.56,0.64,1);
  box-shadow:0 0 100px rgba(180,140,80,0.1),inset 0 0 60px rgba(0,0,0,0.4);
}
.event-overlay.active .event-box{transform:scale(1)}
.event-box .event-icon{font-size:28px;margin-bottom:10px;display:block;filter:drop-shadow(0 0 12px rgba(212,147,58,0.4))}
.event-box h3{font-size:14px;color:var(--gold-light);letter-spacing:4px;margin-bottom:12px;font-weight:600;text-shadow:0 0 16px rgba(212,147,58,0.3)}
.event-box p{font-size:12px;color:var(--text-dim);line-height:2;margin-bottom:20px}
.event-box button{
  padding:8px 28px;border-radius:18px;border:1px solid rgba(212,147,58,0.35);
  background:transparent;color:var(--gold-light);font-size:11.5px;cursor:pointer;
  transition:all 0.3s;letter-spacing:3px;font-family:inherit;
}
.event-box button:hover{background:rgba(212,147,58,0.1);box-shadow:0 0 28px rgba(212,147,58,0.15)}

@media(max-width:520px){
  .terminal{border-radius:10px;height:97vh}
  .chat-area{padding:12px 14px}
  .header{padding:10px 14px 7px}
  .status-panel{padding:5px 14px 4px;grid-template-columns:1fr}
  .phase-bar{padding:4px 14px 2px}
  .quick-options{padding:0 14px 5px}
  .input-area{padding:8px 14px 12px}
  .bubble{font-size:12px;padding:8px 12px}
}
</style>
</head>
<body>
<div class="terminal" id="terminal" data-phase="0">
  <div class="header">
    <div class="header-left">
      <div class="avatar-ring"><div class="avatar">昼</div></div>
      <div class="header-info">
        <h1>夏以昼</h1>
        <div class="status"><span class="status-dot"></span><span id="statusText">远空舰队 · 信号接入中</span></div>
      </div>
    </div>
  </div>
  <div class="phase-bar" id="phaseBar">
    <div class="phase-step" data-phase="0">兄妹期<span class="dot"></span></div>
    <div class="phase-step" data-phase="1">暧昧期<span class="dot"></span></div>
    <div class="phase-step" data-phase="2">确立关系<span class="dot"></span></div>
    <div class="phase-step" data-phase="3">深度亲密<span class="dot"></span></div>
  </div>
  <div class="status-panel">
    <div class="stat-row"><span class="stat-label">牵绊</span><div class="stat-track"><div class="stat-fill affection" id="affFill"></div></div><span class="stat-value" id="affVal">0</span></div>
    <div class="stat-row"><span class="stat-label">占有</span><div class="stat-track"><div class="stat-fill possess" id="posFill"></div></div><span class="stat-value" id="posVal">0</span></div>
    <div class="stat-row"><span class="stat-label">引力</span><div class="stat-track"><div class="stat-fill gravity" id="gravFill"></div></div><span class="stat-value" id="gravVal">0</span></div>
    <div class="stat-row"><span class="stat-label">信任</span><div class="stat-track"><div class="stat-fill trust" id="truFill"></div></div><span class="stat-value" id="truVal">0</span></div>
  </div>
  <div class="chat-area" id="chatArea"></div>
  <div class="quick-options" id="quickOptions"></div>
  <div class="input-area">
    <input type="text" id="userInput" placeholder="对他说话……" autocomplete="off">
    <button id="sendBtn" onclick="sendMessage()">发送</button>
  </div>
  <div class="event-overlay" id="eventOverlay">
    <div class="event-box">
      <span class="event-icon" id="eventIcon"></span>
      <h3 id="eventTitle"></h3>
      <p id="eventDesc"></p>
      <button onclick="closeEvent()">继续</button>
    </div>
  </div>
</div>
<script>
// ================================================================
// 夏以昼 · 引力所归 — 心情驱动对话引擎
// 核心：他先想，再动，最后说。同一句话在不同心情下完全不同。
// ================================================================

const PHASES=[
  {name:'兄妹期',minAff:0,minPos:0,minGrav:0,minTru:0,status:'远空舰队 · 信号接入中'},
  {name:'暧昧期',minAff:20,minPos:15,minGrav:12,minTru:10,status:'远空舰队 · 引力场波动'},
  {name:'确立关系',minAff:45,minPos:35,minGrav:30,minTru:25,status:'远空舰队 · 引力锁定'},
  {name:'深度亲密',minAff:70,minPos:55,minGrav:50,minTru:45,status:'远空舰队 · 唯一坐标'},
];

const S={
  phase:0,affection:0,possess:0,gravity:0,trust:0,
  turnCount:0,isTyping:false,
  triggeredMemories:new Set(),triggeredEvents:new Set(),
  // 心情系统
  mood:'warm',           // warm | teasing | jealous | possessive | vulnerable | hurt | tender
  moodIntensity:0,       // 0-10
  // 上下文
  recentUserTexts:[],    // 最近用户输入
  recentThemes:[],       // 最近主题
  consecutiveIntimacy:0,
  consecutiveReject:0,
  lastMentioned:null,    // 用户最近提到的人/事
  // 内心独白池——已说过的独白不重复
  usedThoughts:new Set(),
};

const DOM={};
function rand(a){return a[Math.floor(Math.random()*a.length)]}
function clamp(v,mn,mx){return v<mn?mn:v>mx?mx:v}
function chance(p){return Math.random()<p}

function computePhase(){
  let p=0;
  for(let i=PHASES.length-1;i>=0;i--){
    const ph=PHASES[i];
    if(S.affection>=ph.minAff&&S.possess>=ph.minPos&&S.gravity>=ph.minGrav&&S.trust>=ph.minTru){p=i;break}
  }
  return p;
}

let statsDirty=false;
function scheduleStatsUpdate(){
  if(statsDirty)return;
  statsDirty=true;
  requestAnimationFrame(()=>{
    statsDirty=false;
    DOM.affFill.style.width=S.affection+'%';
    DOM.affVal.textContent=Math.round(S.affection);
    DOM.posFill.style.width=S.possess+'%';
    DOM.posVal.textContent=Math.round(S.possess);
    DOM.gravFill.style.width=S.gravity+'%';
    DOM.gravVal.textContent=Math.round(S.gravity);
    DOM.truFill.style.width=S.trust+'%';
    DOM.truVal.textContent=Math.round(S.trust);

function updateStats(effect){
  if(!effect)return;
  S.affection=clamp(S.affection+(effect.aff||0),0,100);
  S.possess=clamp(S.possess+(effect.pos||0),0,100);
  S.gravity=clamp(S.gravity+(effect.grav||Math.round((S.affection*0.2+S.possess*0.5)/10)),0,100);
  S.trust=clamp(S.trust+(effect.tru||0),0,100);
  scheduleStatsUpdate();

  const np=computePhase();
  if(np!==S.phase){
    S.phase=np;
    updatePhaseUI();
    const narr=[
      '引力场的波动变得频繁。他的通讯信号不再规律。',
      '频道加密等级提升。他不再隐藏语气里的占有。',
      '你周围的引力开始向他偏移。每一句话都在收窄你的活动范围。',
      '引力场的中心是你。起点是你，终点也是你。'
    ];
    if(narr[np])setTimeout(()=>addNarration(narr[np]),500);
    updateQuick();
  }
  checkSpecialEvents();
}

function updatePhaseUI(){
  DOM.terminal.setAttribute('data-phase',S.phase);
  const steps=document.querySelectorAll('.phase-step');
  for(let i=0;i<steps.length;i++){
    const el=steps[i];
    el.classList.toggle('active',i===S.phase);
    el.classList.toggle('done',i<S.phase);
  }
  DOM.statusText.textContent=PHASES[S.phase].status;
}

function updateMood(text){
  const t=text;
  // 优先级：受伤 > 占有 > 嫉妒 > 脆弱 > 调情 > 温柔
  if(/不需要你|不需要我|不需要你了|我不需要/.test(t)){
    S.mood='hurt'; S.moodIntensity=Math.min(10,S.moodIntensity+4); return;
  }
  if(/讨厌|烦|放开|别管|分手|结束|不要你|松开|走开|离开我/.test(t)){
    S.mood='possessive'; S.moodIntensity=Math.min(10,S.moodIntensity+3); return;
  }
  if(/黎深|医生|蒋飞|别人|和谁|朋友|同事/.test(t)){
    S.mood='jealous'; S.moodIntensity=Math.min(10,S.moodIntensity+3); return;
  }
  if(/怕|害怕|担心|噩梦|梦到/.test(t)){
    S.mood='vulnerable'; S.moodIntensity=Math.min(10,S.moodIntensity+2); return;
  }
  if(/喜欢|爱你|想你|心动|抱|亲|牵手|吻|拥抱|好想/.test(t)){
    S.mood='tender'; S.moodIntensity=Math.min(10,S.moodIntensity+2); return;
  }
  if(/哥哥|哥/.test(t)){
    S.mood='possessive'; S.moodIntensity=Math.min(10,S.moodIntensity+1); return;
  }
  if(/吃|饿|饭|休息|累|晚安|睡|辛苦|疼|受伤|注意|小心|冷|淋/.test(t)){
    S.mood='warm'; S.moodIntensity=Math.min(10,S.moodIntensity+1); return;
  }
  // 中性——心情缓慢衰减
  S.moodIntensity=Math.max(0,S.moodIntensity-1);
  if(S.moodIntensity<=2)S.mood='warm';
}

   text:'你送他的入学礼物。苹果吊坠项链。他从不摘下来。哪怕穿着执舰官制服，链子也贴在锁骨上。飞行前，他会习惯性地亲吻吊坠。"你愿意给的，就是我想要的。你想得到的，就是我愿意付出的。"'},

  {id:'mental',cond:()=>S.affection>=28&&S.trust>=18,keys:['心理','测试','实验','742','阴暗','供体','X-02'],
   text:'9-10岁时，他已经接受了第742次EVOL监测实验。几乎科科满分，唯独心理健康教育分数倒数。心理测试结果："建议接受心理访谈。"被问是不是内心很阴暗，他愉快地回答——"说不定是。"以他的能力完全可以写出正确答案。但他偏不。他就是要坦荡地暴露真实的内心。'},
  {id:'endlessSummer',cond:()=>S.affection>=35,keys:['无尽夏','绣球','海棠','花','天行','夏天','回来'],
   text:'"可是，天行市没有无尽夏。"——夏以昼《无尽夏》。无尽夏的花语是团圆。海棠花是他的代表花。这两个意象，贯穿了他所有关于"回来"的承诺。'},
  {id:'explosion',cond:()=>S.affection>=42&&S.possess>=28,keys:['爆炸','死','两年','消失','回来','活着','机械','假死'],
   text:'流云区爆炸案。他被认定死亡。两年后以远空舰队执舰官身份回归。右臂是高智能精细仿生手臂，瞳色变成了紫橙渐变。他说："可惜，我早就已经死过一次了——不会再死一次。"没有人知道他这两年经历了什么。他也不会说。'},
  {id:'anchor',cond:()=>S.affection>=52&&S.gravity>=35,keys:['深空','隧道','巡航','星','宇宙','航线','引力','乱流'],
   text:'"当迷失在乱流中时，我才发现有一种引力是你。"——夏以昼。你永远都是他存在于世的那个"锚点"，是他坚持下去的意义。你所在的地方，也是他无论走多远都想要再回来的"家"。'},
  {id:'halfFace',cond:()=>S.affection>=60&&S.possess>=40,keys:['半明半暗','阴影','光','脸','表情','失控'],
   text:'剧情中反复出现一个视觉符号——夏以昼的脸一半被光照亮，一半在阴影中。这个画面每次出现，都是因为触发了"不需要"和"哥哥"这些敏感词。每次他都情绪失控。那半张阴影里的脸，才是真实的他。'},
  {id:'century',cond:()=>S.affection>=70&&S.possess>=50,keys:['一百年','永远','留下','在一起','一辈子','不走','留在这里'],
   text:'"我想要你留在这里，留下来，跟我过一百年。"——夏以昼。说这话时他在老宅院子里，海棠花落了一地。声音很轻，轻得像怕被风吹散。'},
  {id:'meta',cond:()=>S.affection>=85&&S.possess>=60&&S.gravity>=55,keys:['世界','存在','真实','宇宙','意义','你之前','锚点'],
   text:'"在你之前，这个世界真的存在过吗。"——夏以昼。官方角色分析中唯一被标注为"具有meta感"的男主。他具有极强的主体性，永远是制定规则的上位者。而你是他唯一愿意低头的人。'},
];

// ================================================================
// 回复生成器 — 从心情池里挑，加上独白和动作
// ================================================================
function pickResponse(text){
  // 特殊触发：不需要 → hurt
  if(/不需要你|不需要我|不需要你了|我不需要/.test(text)){
    S.mood='hurt';
  }
  const phasePool=RESPONSES[S.phase];
  const moodPool=phasePool[S.mood]||phasePool.warm;
  const pick=rand(moodPool);
  return pick;
}

function pickThought(){
  const pool=THOUGHTS[S.mood]||THOUGHTS.warm;
  // 从没说过里面挑
  const unused=pool.filter(t=>!S.usedThoughts.has(t));
  const chosen=unused.length>0?rand(unused):rand(pool);
  if(S.usedThoughts.size>30)S.usedThoughts.clear();
  S.usedThoughts.add(chosen);
  return chosen;
}

function pickAction(customAction){
  if(customAction)return customAction;
  const pool=MOOD_ACTIONS[S.mood]||MOOD_ACTIONS.warm;
  return rand(pool);
}

function checkMemory(text){
  for(const m of MEMORIES){
    if(S.triggeredMemories.has(m.id))continue;
    if(!m.cond())continue;
    if(m.keys.some(k=>text.includes(k))){
      S.triggeredMemories.add(m.id);
      setTimeout(()=>addMemory(m.text),600);
      return;
    }
  }
}

// ================================================================
// 特殊事件
// ================================================================
const EVENTS=[
  {id:'ev_night',cond:()=>S.phase>=1&&S.possess>=15&&!S.triggeredEvents.has('ev_night'),
   icon:'🌙',title:'夜色',
   desc:'他靠在门框上。光线从走廊尽头照过来。他的右半张脸是亮的，左半张隐在阴影里。你在阴影里看见他的眼睛——紫橙渐变。像某种你从未见过的东西。他没有说话。只是看着你。'},
  {id:'ev_gravity',cond:()=>S.phase>=2&&S.gravity>=30&&!S.triggeredEvents.has('ev_gravity'),
   icon:'◈',title:'引力场异动',
   desc:'你周围的空气突然变沉。桌上的杯子轻轻震动，全息屏幕泛起涟漪。他抬眼看你，瞳色在暗光里翻涌。"抱歉。"他收回手，"引力失控了。……因为你在。"'},
  {id:'ev_lock',cond:()=>S.phase>=2&&S.possess>=45&&!S.triggeredEvents.has('ev_lock'),
   icon:'🔒',title:'安全范围',
   desc:'你收到一条远空舰队的内部通知。关于"执舰官安全范围设定"——以他为中心，半径三百米。通知末尾有一行手写体，是他的字。"这不是保护。这只是……我不想你走太远。"'},
  {id:'ev_late',cond:()=>S.phase>=3&&S.possess>=55&&!S.triggeredEvents.has('ev_late'),
   icon:'🕐',title:'凌晨三点',
   desc:'你醒过来的时候，他坐在床边。没有开灯。月光照在他的侧脸上，一半明，一半暗。他看着你，不知道已经看了多久。"吵醒你了？"他的声音很轻，"睡吧。我只是……看看你。"'},
  {id:'ev_end',cond:()=>S.phase>=3&&S.affection>=85&&S.trust>=60&&!S.triggeredEvents.has('ev_end'),
   icon:'☀',title:'引力所归',
   desc:'他把苹果项链从领口里拉出来。吊坠在灯光下微微发亮，边缘已经磨得光滑。"你送我的第一件东西。"他说，"从那天起，我就知道——我跑不掉了。"他抬起头。眼神温柔，又固执。像是把整个宇宙的引力都压在了一句话上。"引力所归。起点是你，终点也是你。"'}
];

function checkSpecialEvents(){
  for(const ev of EVENTS){
    if(S.triggeredEvents.has(ev.id))continue;
    if(ev.cond()){
      S.triggeredEvents.add(ev.id);
      setTimeout(()=>{
        DOM.eventIcon.textContent=ev.icon;
        DOM.eventTitle.textContent=ev.title;
        DOM.eventDesc.textContent=ev.desc;
        DOM.eventOverlay.classList.add('active');
      },1200);
      break;
    }
  }
}

function closeEvent(){DOM.eventOverlay.classList.remove('active')}

function updateQuick(){
  const opts={
    0:['今天吃什么','我有点想你','小时候的事','晚安','奶奶最近好吗'],
    1:['你从来不是我的哥哥','关于你的机械臂','我有点害怕','你在天行好吗','我梦到以前了'],
    2:['我不想走','关于EVER','你为什么回来','别再管我了','那你也拥有一点罪'],
    3:['引力所归','下辈子别当我哥哥','苹果项链','我爱你','在我之前世界存在吗']
  };
  const pool=opts[S.phase]||opts[0];
  const q=DOM.quickOptions;
  const frag=document.createDocumentFragment();
  pool.forEach(txt=>{
    const b=document.createElement('button');
    b.className='quick-btn'+(S.phase>=2?' special':'')+(S.phase>=3?' danger':'');
    b.textContent=txt;
    b.onclick=()=>{DOM.userInput.value=txt;sendMessage()};
    frag.appendChild(b);
  });
  q.innerHTML='';
  q.appendChild(frag);
}

// ================================================================
// 发送 — 独白 → 动作 → 台词 → 余韵
// ================================================================
function sendMessage(){
  const text=DOM.userInput.value.trim();
  if(!text||S.isTyping)return;
  DOM.userInput.value='';
  addMe(text);
  S.turnCount++;
  S.isTyping=true;
  DOM.sendBtn.disabled=true;

  // 记录上下文
  S.recentUserTexts.push(text);
  if(S.recentUserTexts.length>6)S.recentUserTexts.shift();

  checkMemory(text);
  updateMood(text);
  const reply=pickResponse(text);
  const thought=pickThought();
  const action=pickAction(reply.a);

  // 时间线：独白 → 动作 → 台词 → 解锁
  const T1=320;   // 打字开始
  const T2=950;   // 显示独白
  const T3=1550;  // 显示动作
  const T4=2100;  // 显示台词
  const T5=2250;  // 解锁

  setTimeout(()=>showTyping(),T1);

  setTimeout(()=>{
    hideTyping();
    addThought(thought);
  },T2);

  setTimeout(()=>{
    if(action)addAction(action);
  },T3);

  setTimeout(()=>{
    doAddXia(reply.lines[0]);
    if(reply.e)updateStats(reply.e);
  },T4);

  setTimeout(()=>{
    S.isTyping=false;
    DOM.sendBtn.disabled=false;
    DOM.userInput.focus();
  },T5);
}

// ================================================================
// 初始化
// ================================================================
function init(){
  DOM.chatArea=document.getElementById('chatArea');
  DOM.userInput=document.getElementById('userInput');
  DOM.sendBtn=document.getElementById('sendBtn');
  DOM.quickOptions=document.getElementById('quickOptions');
  DOM.statusText=document.getElementById('statusText');
  DOM.terminal=document.getElementById('terminal');
  DOM.eventOverlay=document.getElementById('eventOverlay');
  DOM.eventIcon=document.getElementById('eventIcon');
  DOM.eventTitle=document.getElementById('eventTitle');
  DOM.eventDesc=document.getElementById('eventDesc');
  DOM.affFill=document.getElementById('affFill');
  DOM.affVal=document.getElementById('affVal');
  DOM.posFill=document.getElementById('posFill');
  DOM.posVal=document.getElementById('posVal');
  DOM.gravFill=document.getElementById('gravFill');
  DOM.gravVal=document.getElementById('gravVal');
  DOM.truFill=document.getElementById('truFill');
  DOM.truVal=document.getElementById('truVal');

  DOM.chatArea.innerHTML='';
  S.phase=0;S.affection=0;S.possess=0;S.gravity=0;S.trust=0;
  S.turnCount=0;S.triggeredMemories.clear();S.triggeredEvents.clear();
  S.mood='warm';S.moodIntensity=2;S.recentUserTexts=[];
  S.consecutiveIntimacy=0;S.consecutiveReject=0;S.usedThoughts.clear();
  updatePhaseUI();
  scheduleStatsUpdate();
  updateQuick();

  setTimeout(()=>addNarration('远空舰队 · 信号接入 · 引力场稳定'),300);
  setTimeout(()=>{
    const opening=rand([
      '回来了？今天猎人协会又这么晚。饭在锅里，先去洗手。',
      '嗯。是我。……你看起来像见了鬼。',
      '别站在门口。进来。外面冷。'
    ]);
    doAddXia(opening);
  },800);
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',()=>{
    init();
    DOM.userInput.addEventListener('keydown',e=>{if(e.key==='Enter')sendMessage()});
    DOM.eventOverlay.addEventListener('click',e=>{if(e.target===DOM.eventOverlay)closeEvent()});
  });
}else{
  init();
  DOM.userInput.addEventListener('keydown',e=>{if(e.key==='Enter')sendMessage()});
  DOM.eventOverlay.addEventListener('click',e=>{if(e.target===DOM.eventOverlay)closeEvent()});
}
</script>
